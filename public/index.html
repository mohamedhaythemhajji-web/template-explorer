<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Template Reference Explorer</title>
<style>
:root{--bg:#f4f5f8;--panel:#fff;--line:#e2e5ec;--ink:#12141a;--muted:#6b7280;--blue:#1a5cff;--blue-soft:#e9efff;--red:#dc2626}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;display:flex;flex-direction:column;height:100dvh;overflow:hidden;
  font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button:disabled{opacity:.45;cursor:default}

/* header */
header{display:flex;align-items:center;gap:14px;padding:0 16px;height:56px;flex:0 0 auto;background:#fff;border-bottom:1px solid var(--line);z-index:10}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:30px;height:30px;border-radius:8px;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:700;font-size:12px;flex:0 0 auto}
.brand h1{font-size:14.5px;margin:0;font-weight:650;letter-spacing:-.2px;white-space:nowrap}
.tools{display:flex;align-items:center;gap:7px;margin-left:auto;flex-wrap:wrap;justify-content:flex-end}
.seg{display:flex;background:#eef0f4;border-radius:8px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:5px 13px;border-radius:6px;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer}
.seg button.active{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.09)}
.btn{border:1px solid var(--line);background:#fff;padding:7px 12px;border-radius:7px;cursor:pointer;font-size:12.5px;font-weight:550;white-space:nowrap;transition:.13s}
.btn:hover:not(:disabled){background:#f7f8fa;border-color:#cfd4de}
.btn.sm{padding:5px 10px;font-size:12px}
.btn.ghost{background:transparent}
.btn.danger{color:var(--red);border-color:#f3d5d5}
.btn.danger:hover:not(:disabled){background:#fdf2f2}
.btn.primary{background:var(--blue);color:#fff;border-color:var(--blue)}
.btn.primary:hover:not(:disabled){background:#0f4ae0}

/* sync pill */
.pill{font-size:11.5px;font-weight:650;padding:4px 10px;border-radius:20px;background:#eef0f4;color:#495063;white-space:nowrap;cursor:pointer;user-select:none}
.pill.ok{background:#e8f5ec;color:#17703a}
.pill.busy{background:#e9efff;color:#153fa8}
.pill.warn{background:#fdf0e3;color:#9a5510}
.pill.err{background:#fdecec;color:#b42318}

/* layout */
main{display:flex;flex:1;min-height:0}
#center{flex:1;min-width:0;display:flex;flex-direction:column}
#bar{flex:0 0 auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 14px;background:#fff;border-bottom:1px solid var(--line);min-height:46px}
#bar select,#bar input[type=search]{border:1px solid var(--line);border-radius:7px;padding:5px 8px;font-size:12.5px;background:#fff;max-width:220px}
.sep{width:1px;height:20px;background:var(--line)}
.opt{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap}
.zoom{display:flex;align-items:center;gap:4px}
.zl{min-width:44px;text-align:center;font-size:12px;font-weight:650}
.chipb{display:inline-flex;align-items:center;gap:4px;background:var(--blue-soft);color:#153fa8;border-radius:20px;padding:3px 4px 3px 10px;font-size:12px;font-weight:600}
.chipb button{border:0;background:transparent;cursor:pointer;color:#153fa8;border-radius:50%;width:18px;height:18px;line-height:1}
.chipb button:hover{background:rgba(0,0,0,.08)}
#stage{flex:1;min-height:0;overflow:auto}
#stage.ed{display:flex;padding:30px;background-image:radial-gradient(circle,#d8dce5 1px,transparent 1px);background-size:22px 22px}
#stage.lib{padding:22px}
#stage.cmp{display:flex;gap:26px;padding:26px;align-items:flex-start}
#panel{width:400px;flex:0 0 400px;background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;overscroll-behavior:contain}
body[data-view=library] #panel{display:none}
body:not([data-view=editor]) .only-ed{display:none!important}
body[data-mode=view] .only-edit{display:none!important}

/* canvas + regions */
.canvas{position:relative;display:block;flex:none;margin:auto;line-height:0;box-shadow:0 8px 34px rgba(15,23,42,.13);border-radius:4px;background:#fff}
.canvas img{display:block;width:100%;height:auto;border-radius:4px;user-select:none;-webkit-user-drag:none}
.overlay{position:absolute;inset:0;line-height:normal}
.overlay.edit{cursor:crosshair;touch-action:none}
.region{position:absolute;border:1.5px solid var(--c);border-radius:3px;cursor:pointer;transition:opacity .18s}
.region::before{content:'';position:absolute;inset:0;background:var(--c);opacity:.09;transition:opacity .13s;pointer-events:none}
.region:hover::before{opacity:.2}
.region.is-selected{border-width:2px;outline:2px solid var(--c);outline-offset:2px;z-index:3}
.region.is-selected::before{opacity:.2}
.overlay.edit .region{cursor:move;touch-action:none}
.region.live{border-style:dashed;pointer-events:none}
.canvas.has-sel .region:not(.is-selected){opacity:.25}
.badge{position:absolute;top:-11px;left:-11px;height:22px;padding:0 6px;border-radius:11px;background:var(--c);color:#fff;border:2px solid #fff;
  font-size:11px;font-weight:700;display:flex;align-items:center;line-height:1;box-shadow:0 1px 3px rgba(0,0,0,.25);pointer-events:none;z-index:2;white-space:nowrap}
.badge b{min-width:10px;text-align:center}
.badge i{display:none;font-style:normal;font-weight:600;margin-left:5px;max-width:170px;overflow:hidden;text-overflow:ellipsis}
.canvas.labels .badge i:not(:empty){display:inline}
.dim{display:none;position:absolute;left:0;top:100%;margin-top:5px;background:#12141a;color:#fff;font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:5px;white-space:nowrap;pointer-events:none;z-index:5;line-height:1.4}
.region.is-selected .dim,.region.live .dim,.region.dragging .dim{display:block}
.handle{display:none;position:absolute;width:10px;height:10px;background:#fff;border:2px solid var(--c);border-radius:3px;z-index:4}
.overlay.edit .region.is-selected .handle{display:block}
.handle[data-h=nw]{left:-6px;top:-6px;cursor:nwse-resize}
.handle[data-h=ne]{right:-6px;top:-6px;cursor:nesw-resize}
.handle[data-h=sw]{left:-6px;bottom:-6px;cursor:nesw-resize}
.handle[data-h=se]{right:-6px;bottom:-6px;cursor:nwse-resize}
.handle[data-h=n]{left:50%;top:-6px;margin-left:-5px;cursor:ns-resize}
.handle[data-h=s]{left:50%;bottom:-6px;margin-left:-5px;cursor:ns-resize}
.handle[data-h=w]{top:50%;left:-6px;margin-top:-5px;cursor:ew-resize}
.handle[data-h=e]{top:50%;right:-6px;margin-top:-5px;cursor:ew-resize}

.dropzone{width:min(560px,90%);margin:auto;padding:70px 30px;border:2px dashed #c3cad6;border-radius:14px;background:rgba(255,255,255,.75);text-align:center;cursor:pointer;transition:.15s}
.dropzone:hover{border-color:var(--blue);background:#fff}
.dz-icon{font-size:34px;color:#b9c0cd;margin-bottom:12px;line-height:1}
.dropzone h2{margin:0 0 6px;font-size:17px;font-weight:650}
.dropzone p{margin:0;font-size:13px;color:var(--muted)}

/* library */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.card{position:relative;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;transition:.15s;display:flex;flex-direction:column}
.card:hover{box-shadow:0 6px 22px rgba(15,23,42,.1);border-color:#cfd4de}
.card.picked{border-color:var(--blue);box-shadow:0 0 0 2px rgba(26,92,255,.25)}
.card.current .ctitle::after{content:'  · current';color:var(--muted);font-weight:500;font-size:11px}
.thumb{height:200px;background:#eceff4;display:flex;align-items:center;justify-content:center;position:relative;color:var(--muted);font-size:12px}
.thumb img{max-width:100%;max-height:100%;object-fit:contain}
.cnt{position:absolute;right:8px;bottom:8px;background:rgba(18,20,26,.8);color:#fff;font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px}
.pick{position:absolute;left:8px;top:8px;background:rgba(255,255,255,.92);border-radius:6px;padding:4px 5px 1px;z-index:2;line-height:1}
.cbody{padding:11px 13px 6px}
.ctitle{font-weight:650;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cmeta{font-size:11.5px;color:var(--muted);margin-top:2px}
.cact{display:flex;gap:6px;padding:6px 13px 12px;margin-top:auto}
.card.add{align-items:center;justify-content:center;min-height:280px;border-style:dashed;color:var(--muted);font-weight:600;background:transparent}
.card.add:hover{color:var(--blue);border-color:var(--blue)}
.empty-lib{padding:50px;text-align:center;color:var(--muted)}

/* compare */
.col{flex:0 0 auto}
.col-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:9px}
.col-head b{display:block;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:240px}
.col-head span{font-size:11.5px;color:var(--muted)}
.col .canvas{width:100%;margin:0}
.noimg{aspect-ratio:1;display:grid;place-items:center;color:var(--muted);font-size:12px;line-height:1.4}

/* panel */
.panel-top{padding:16px 18px 14px;border-bottom:1px solid var(--line)}
.board-name-view{margin:0 0 4px;font-size:16px;font-weight:650;letter-spacing:-.2px}
input.board-name{width:100%;border:1px solid transparent;background:transparent;border-radius:6px;padding:4px 6px;margin:-4px -6px 4px;font-size:16px;font-weight:650}
input.board-name:hover{border-color:var(--line)}
input.board-name:focus{outline:0;border-color:var(--blue);background:#fff}
.board-meta{font-size:12px;color:var(--muted);margin-bottom:11px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.panel-sec{padding:15px 18px;border-bottom:1px solid var(--line)}
.sec-title{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.sec-title .row{gap:5px}
.empty-sel{font-size:12.5px;color:var(--muted);line-height:1.55;background:#f7f8fa;border:1px dashed var(--line);border-radius:8px;padding:13px}
.hint{font-size:11.5px;color:var(--muted);line-height:1.55;margin-top:10px}
.detail-head{display:flex;gap:11px;align-items:flex-start;margin-bottom:12px}
.num-big{width:30px;height:30px;flex:0 0 auto;border-radius:9px;color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px}
.detail-head h3{margin:0;font-size:15px;font-weight:650;line-height:1.25;padding-top:5px}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px}
.chip{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;background:var(--blue-soft);color:#153fa8;padding:3px 8px;border-radius:5px;font-weight:600;border:0;cursor:copy}
.chip:hover{background:#d9e4ff}
.tagrow{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tag{font-size:10.5px;font-weight:650;padding:3px 9px;border-radius:20px}
.tag.t-concept{background:#f1f2f6;color:#495063}
.spec{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.spec div{background:#f7f8fa;border-radius:8px;padding:7px 10px}
.spec span{display:block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.spec b{font-size:12.5px;font-weight:650}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:12.5px;padding:5px 0;border-bottom:1px solid #f0f1f5}
.kv span{color:var(--muted)}.kv b{font-weight:600;text-align:right;word-break:break-word}
.notes{font-size:12.5px;color:#374151;line-height:1.55;margin:10px 0 0;white-space:pre-wrap}

.form label{display:block;font-size:11px;font-weight:650;color:var(--muted);margin-bottom:10px}
.form input,.form select,.form textarea{width:100%;margin-top:4px;border:1px solid var(--line);border-radius:6px;padding:6px 9px;font-size:13px;background:#fff;resize:vertical}
.form input:focus,.form select:focus,.form textarea:focus{outline:0;border-color:var(--blue);box-shadow:0 0 0 3px rgba(26,92,255,.11)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.four{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.subhead{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:14px 0 8px;display:flex;justify-content:space-between;align-items:center}
.subhead .ratioOut{text-transform:none;letter-spacing:0;color:var(--ink);font-size:12px}
.subhead button{border:0;background:transparent;color:var(--blue);font-weight:650;cursor:pointer;font-size:12px}
.form .inl{display:flex;align-items:center;gap:6px;margin:0;font-size:12px}
.form .inl input{width:auto;margin:0}
.rowsb{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.rowsb select{width:auto;margin:0}
.kvrow{display:grid;grid-template-columns:1fr 1.3fr 26px;gap:6px;margin-bottom:6px}
.kvrow input{margin:0!important}
.kvrow .x{border:0;background:transparent;cursor:pointer;color:var(--muted);border-radius:6px}
.kvrow .x:hover{background:#f3f4f7;color:var(--red)}

.list-item{display:flex;gap:10px;align-items:center;padding:7px 9px;border-radius:7px;cursor:pointer;margin-bottom:1px}
.list-item:hover{background:#f5f6f9}
.list-item.is-selected{background:var(--blue-soft)}
.list-item .num{width:22px;height:22px;flex:0 0 auto;border-radius:6px;color:#fff;display:grid;place-items:center;font-size:10.5px;font-weight:700}
.li-label{font-size:12.5px;font-weight:600;line-height:1.3}
.li-feed{font-size:11px;color:var(--muted);font-family:ui-monospace,Menlo,monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:280px}
.filter{width:100%;border:1px solid var(--line);border-radius:7px;padding:6px 9px;font-size:12.5px;margin-bottom:8px}
.filter:focus{outline:0;border-color:var(--blue)}
.mini{border:1px solid var(--line);background:#fff;border-radius:6px;font-size:11px;padding:2px 8px;cursor:pointer;font-weight:600;text-transform:none;letter-spacing:0;color:var(--ink)}
.mini:hover{background:#f5f6f9}

/* compare groups */
.grp{border:1px solid var(--line);border-radius:9px;padding:9px 11px;margin-bottom:8px;cursor:pointer}
.grp:hover{border-color:#cfd4de}
.grp.is-selected{border-color:var(--blue);background:#f6f9ff}
.grp-h{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:13px;margin-bottom:5px}
.flag{font-size:10px;font-weight:700;padding:2px 7px;border-radius:10px;background:#f1f2f6;color:#495063}
.flag.warn{background:#fdf0e3;color:#9a5510}
.grp-row{display:flex;gap:8px;font-size:11.5px;padding:2px 0;align-items:baseline}
.grp-row .bn{flex:0 0 96px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grp-row .bf{font-family:ui-monospace,Menlo,monospace;word-break:break-word}
.grp-row .bf.none{color:#b4bac6;font-family:inherit}
.xtra{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);font-size:12px;color:#374151}
.xtra b{font-weight:650}

/* modal */
.backdrop{position:fixed;inset:0;background:rgba(18,20,26,.45);display:grid;place-items:center;z-index:60;padding:16px}
.modal{background:#fff;border-radius:14px;width:min(460px,100%);max-height:90vh;overflow:auto;padding:20px 22px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal.wide{width:min(760px,100%)}
.modal h3{margin:0 0 12px;font-size:16px}
.ml{display:block;font-size:11.5px;font-weight:650;color:var(--muted);margin-bottom:12px}
.ml input,.ml select,.ml textarea{width:100%;margin-top:4px;border:1px solid var(--line);border-radius:7px;padding:8px 10px;font-size:13px}
.ml textarea{font-family:ui-monospace,Menlo,monospace;font-size:12px;white-space:pre}
.cf{display:flex;gap:6px;align-items:center;margin-top:4px;flex-wrap:wrap}
.cf select{flex:1 1 100%;margin:0!important}
.cf input{flex:1;margin:0!important;min-width:0}
.mhint{font-size:12px;color:var(--muted);line-height:1.55;margin:0 0 12px}
.mact{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.exp{display:flex;flex-direction:column;gap:8px}
.exp button{text-align:left;padding:10px 13px;border:1px solid var(--line);background:#fff;border-radius:9px;cursor:pointer}
.exp button:hover{border-color:var(--blue);background:#f6f9ff}
.exp b{display:block;font-size:13px}.exp span{font-size:11.5px;color:var(--muted)}

#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(14px);background:#12141a;color:#fff;padding:10px 18px;border-radius:8px;font-size:12.5px;opacity:0;pointer-events:none;transition:.22s;z-index:99;font-weight:550;max-width:90vw}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media(max-width:900px){
  main{flex-direction:column}
  #panel{width:100%;flex:1 1 auto;border-left:0;border-top:1px solid var(--line)}
  #center{flex:0 0 auto;max-height:58vh}
  .brand h1{display:none}
}
/* element colours */
.swrow{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin:2px 0 14px}
.swl{width:100%;font-size:11px;font-weight:650;color:var(--muted)}
.sw{width:24px;height:24px;padding:0;border:2px solid #fff;border-radius:8px;background:var(--s);box-shadow:0 0 0 1px var(--line);cursor:pointer;transition:transform .12s,box-shadow .12s}
.sw:hover{transform:scale(1.15)}
.sw.on{box-shadow:0 0 0 2px var(--ink)}
.sw.auto{background:#fff;color:var(--muted);font-size:13px;font-weight:700;line-height:1;display:grid;place-items:center}
.region{transition:opacity .18s,border-color .15s}
.badge,.num-big,.list-item .num,.tag{transition:background .15s,color .15s}
/* colour picker */
.cp{position:relative;margin:2px 0 14px}
.cp-lab{font-size:11px;font-weight:650;color:var(--muted);margin-bottom:4px}
.cp-btn{display:flex;align-items:center;gap:9px;width:100%;padding:5px 9px;border:1px solid var(--line);border-radius:6px;background:#fff;cursor:pointer;text-align:left}
.cp-btn:hover{border-color:#cfd4de}
.cp-chip{width:34px;height:18px;border-radius:5px;background:var(--s);box-shadow:inset 0 0 0 1px rgba(0,0,0,.12);flex:none;transition:background .15s}
.cp-txt{flex:1;font-size:12.5px;font-weight:600}
.cp-arrow{color:var(--muted);font-size:10px}
.cp-pop{display:none;position:absolute;z-index:20;left:0;right:0;top:100%;margin-top:6px;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(15,23,42,.18);padding:10px}
.cp.open .cp-pop{display:block}
.cp-grid{display:grid;grid-template-columns:repeat(12,1fr);gap:4px}
.cp-sw{aspect-ratio:1;border:0;border-radius:5px;background:var(--s);cursor:pointer;padding:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.1);transition:transform .1s}
.cp-sw:hover{transform:scale(1.25);position:relative;z-index:1}
.cp-sw.on{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--ink)}
.cp-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px;padding-top:9px;border-top:1px solid #f0f1f5}
.cp-foot label{display:flex;align-items:center;gap:7px;margin:0;font-size:12px;font-weight:600;color:var(--muted)}
.cp-foot input[type=color]{width:34px;height:24px;padding:0;margin:0;border:1px solid var(--line);border-radius:5px;background:none;cursor:pointer}
/* required / optional fields */
.kvrow{grid-template-columns:1fr 1.2fr auto 26px}
.reqbtn{border:1px solid var(--line);background:#f1f2f6;color:#6b7280;border-radius:20px;padding:0 9px;min-width:68px;font-size:10.5px;font-weight:700;cursor:pointer;transition:background .15s,color .15s,border-color .15s}
.reqbtn:hover{border-color:#cfd4de}
.reqbtn.on{background:#fdecec;color:#b42318;border-color:#f6c9c4}
.reqtag,.opttag{font-style:normal;font-size:9.5px;font-weight:700;padding:1px 7px;border-radius:10px;margin-left:7px;vertical-align:1px}
.reqtag{background:#fdecec;color:#b42318}
.opttag{background:#f1f2f6;color:#6b7280}
/* video scenes */
#strip{display:none;flex:0 0 auto;align-items:center;gap:12px;padding:8px 14px;background:#fafbfc;border-bottom:1px solid var(--line)}
.st-items{display:flex;gap:8px;overflow-x:auto;flex:1;min-width:0;padding:3px}
.scn{flex:0 0 auto;width:78px;cursor:pointer;text-align:center}

<body>

  <div class="seg" id="viewSeg">
    <button data-view="library">Library</button>

<main>
  <div id="center">
    <div id="bar"></div>
    <div id="strip"></div>
    <section id="stage"></section>
  </div>
  <aside id="panel"></aside>
</main>
<div id="modalRoot"></div>
<div id="toast"></div>

<script>
/* =========================================================
   Template Reference Explorer
   Local cache: IndexedDB. Cloud: Netlify Blobs via /api (Netlify Function).
   Video templates: each scene is a normal board that shares a `vid`.
   Elements: rectangle, freehand shape, or arrow. All can be rotated.
   ========================================================= */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const gcd=(a,b)=>b?gcd(b,a%b):a;
const slug=s=>(s||'template').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'template';
const csv=s=>s.split(',').map(x=>x.trim()).filter(Boolean);
const uniq=a=>[...new Set(a)];
const MIN=1; // minimum box size, in % of canvas
const MAXCMP=8; // max templates in Compare
const MAX_IMG_BYTES=3.5*1024*1024; // keeps uploads under Netlify's ~6 MB request limit
const PALETTE=['#1a5cff','#e8820c','#12a150','#d6336c','#7048e8','#0ca5b0','#a16207','#475569'];
const PRESETS=[['auto','Auto (match image size)'],['1080x1080','Square 1:1 · 1080×1080'],['1080x1350','Portrait 4:5 · 1080×1350'],
  ['1080x1920','Story 9:16 · 1080×1920'],['1200x628','Landscape 1.91:1 · 1200×628'],['1920x1080','Landscape 16:9 · 1920×1080'],['custom','Custom']];
const typeColor=(b,t)=>{const i=b.types.indexOf(t);return PALETTE[(i<0?b.types.length:i)%PALETTE.length];};
const splitFeed=s=>(s||'').split(/[,;\n·]/).map(x=>x.trim()).filter(Boolean);
const ARROW_COL='#d6336c';
const IW=b=>b.imgW||b.canvas.w, IH=b=>b.imgH||b.canvas.h;
const normDeg=v=>((((v+180)%360)+360)%360)-180;
const kindIcon=r=>r.kind==='arrow'?'➜ ':(Array.isArray(r.pts)&&r.pts.length>=3?'✎ ':'');

/* ---------- time helpers (video) ---------- */
function parseT(s){
  s=String(s??'').trim();if(!s)return '';
  let v;
  if(s.includes(':')){const p=s.split(':').map(Number);if(p.some(x=>!isFinite(x)))return '';v=p.reduce((a,x)=>a*60+x,0);}
  else v=parseFloat(s);
  return isFinite(v)&&v>=0?Math.round(v*100)/100:'';
}
function fmtT(v){
  if(v===''||v==null||!isFinite(+v))return '';
  v=+v;const m=Math.floor(v/60),s=v-m*60;
  const ss=s%1?s.toFixed(1).padStart(4,'0'):String(Math.floor(s)).padStart(2,'0');
  return m+':'+ss;
}
function timingStr(r){
  const a=fmtT(r.t0),z=fmtT(r.t1);
  if(a===''&&z==='')return 'Whole scene';
  return (a||'0:00')+' → '+(z||'end');
}
const dispName=b=>b.vid?`${b.vname||'Video'} · ${b.name||'Scene'} @ ${fmtT(b.t||0)}`:(b.name||'Untitled');

/* ---------- prefs / settings ---------- */
const prefs=Object.assign({labels:true,snap:0,lock:false,colW:320},JSON.parse(localStorage.getItem('tre_prefs')||'{}'));
const savePrefs=()=>localStorage.setItem('tre_prefs',JSON.stringify(prefs));
const cfg={key:()=>localStorage.getItem('tre_key')||'',model:()=>localStorage.getItem('tre_model')||'claude-sonnet-4-5',maxDim:()=>+localStorage.getItem('tre_max')||2600};

/* ---------- IndexedDB (local cache) ---------- */
const DB_NAME='template-reference-explorer',STORE='boards';
let _db;
function idb(){
  if(_db)return Promise.resolve(_db);
  return new Promise((res,rej)=>{
    const r=indexedDB.open(DB_NAME,1);
    r.onupgradeneeded=e=>{if(!e.target.result.objectStoreNames.contains(STORE))e.target.result.createObjectStore(STORE,{keyPath:'id'});};
    r.onsuccess=()=>{_db=r.result;res(_db);};r.onerror=()=>rej(r.error);
  });
}
const clean=b=>{const o={};for(const k in b)if(k[0]!=='_')o[k]=b[k];return o;};
async function localGetAll(){const db=await idb();return new Promise((res,rej)=>{const q=db.transaction(STORE).objectStore(STORE).getAll();q.onsuccess=()=>res(q.result||[]);q.onerror=()=>rej(q.error);});}
async function localPut(b){const db=await idb();return new Promise((res,rej)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).put(clean(b));tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);});}
async function localDel(id){const db=await idb();return new Promise((res,rej)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).delete(id);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);});}

/* =========================================================
   CLOUD SYNC  (Netlify Blobs through the Netlify Function)
   Local IndexedDB stays as a cache; edits are pushed in the background.
   ========================================================= */
const CLOUD = {
  base: '',   // '' = same site (correct for Netlify). Leave as is.
  token: ''   // optional: must match API_TOKEN on Netlify. If empty and the server requires one, users are asked once.
};
const lsGet = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; } };
const syncMap = lsGet('tre_sync', {});   // id -> { rev, imageRev } as last seen on the server
const dirty   = lsGet('tre_dirty', {});  // id -> { m, i } counters: >0 means unsynced metadata / image
let   tomb    = lsGet('tre_tomb', []);   // ids deleted locally, waiting to be deleted on the server
const persistSync = () => {
  localStorage.setItem('tre_sync', JSON.stringify(syncMap));
  localStorage.setItem('tre_dirty', JSON.stringify(dirty));
  localStorage.setItem('tre_tomb', JSON.stringify(tomb));
};
function markDirty(id, img) { const d = dirty[id] || (dirty[id] = { m: 0, i: 0 }); d.m++; if (img) d.i++; persistSync(); }
const markImgDirty = id => markDirty(id, true);
const isDirty = id => { const d = dirty[id]; return !!d && (d.m > 0 || d.i > 0); };
const isBlankStarter = b => b.id === localStorage.getItem('tre_starter') && !b.image && !b.regions.length && !syncMap[b.id];
const authErr = () => { const e = new Error('auth'); e.code = 'auth'; return e; };

// Same names the rest of the app uses
async function dbGetAll() { return localGetAll(); }
async function dbPut(b) { markDirty(b.id); schedulePush(); await localPut(b); }
async function dbDel(id) {
  await localDel(id);
  delete dirty[id];
  if (syncMap[id]) { tomb.push(id); delete syncMap[id]; }
  persistSync(); schedulePush();
}

async function api(path, opts = {}) {
  const headers = Object.assign({}, opts.headers || {});
  const tok = CLOUD.token || localStorage.getItem('tre_token') || '';
  if (tok) headers['x-team-token'] = tok;
  const r = await fetch(CLOUD.base + path, Object.assign({}, opts, { headers }));
  if (r.status === 401 && !opts._retried) {
    const t = prompt('Enter the team access code for this library:');
    if (t) { localStorage.setItem('tre_token', t.trim()); return api(path, Object.assign({}, opts, { _retried: true })); }
  }
  return r;
}

let syncState = 'idle', syncing = false, again = false, pushT = null, pollT = null;
function setSync(state, text) {
  syncState = state;
  const p = $('#syncPill'); if (!p) return;
  p.className = 'pill ' + state; p.textContent = text;
}
const pendingCount = () => Object.keys(dirty).filter(isDirty).length + tomb.length;
function schedulePush() {
  clearTimeout(pushT); pushT = setTimeout(syncNow, 1500);
  if (syncState !== 'busy') setSync('warn', `☁ ${pendingCount()} unsaved`);
}
const uiBusy = () => {
  const t = document.activeElement && document.activeElement.tagName;
  return !!(draw || drag || ['INPUT', 'TEXTAREA', 'SELECT'].includes(t) || $('#modalRoot').firstChild);
};

async function syncNow() {
  if (syncing) { again = true; return; }
  syncing = true; setSync('busy', '☁ Syncing…');
  try {
    flushSave();
    await pullAll();
    await pushAll();
    setSync('ok', '☁ Synced');
  } catch (e) {
    const n = pendingCount();
    if (e.code === 'auth') setSync('err', '☁ Access code needed');
    else if (!navigator.onLine || e.name === 'TypeError') setSync('warn', '☁ Offline' + (n ? ` · ${n} pending` : ''));
    else setSync('err', '☁ Sync error');
    console.warn('sync failed', e);
  } finally {
    syncing = false;
    if (again) { again = false; setTimeout(syncNow, 300); }
  }
}

async function dropLocal(b) {
  dropUrl(b); await localDel(b.id);
  delete syncMap[b.id]; delete dirty[b.id];
  boards = boards.filter(x => x !== b);
  picked.delete(b.id); cmpIds = cmpIds.filter(i => i !== b.id);
}

async function fetchRemoteBoard(id, local, s) {
  const r = await api('/api/boards/' + id);
  if (r.status === 401) throw authErr();
  if (!r.ok) throw new Error('fetch failed ' + r.status);
  const d = await r.json();
  const nb = Object.assign({}, d);
  const rev = d.rev, imageRev = d.imageRev || 0, hasImage = d.hasImage;
  delete nb.rev; delete nb.imageRev; delete nb.hasImage;
  nb.image = null;
  if (Array.isArray(nb.regions)) convertOldArrows(nb);
  if (hasImage) {
    if (local && local.image instanceof Blob && s && s.imageRev === imageRev) nb.image = local.image;
    else {
      const ir = await api(`/api/boards/${id}/image?v=${imageRev}`);
      if (!ir.ok) throw new Error('image fetch failed');
      nb.image = await ir.blob();
    }
  }
  return { nb, rev, imageRev };
}

async function pullAll() {
  const r = await api('/api/boards');
  if (r.status === 401) throw authErr();
  if (!r.ok) throw new Error('list failed ' + r.status);
  const remote = await r.json();
  const rmap = new Map(remote.map(x => [x.id, x]));
  let changed = false, curReplaced = false;

  // 1) remote -> local
  for (const rm of remote) {
    if (tomb.includes(rm.id)) continue;
    const local = boards.find(b => b.id === rm.id);
    const s = syncMap[rm.id];
    if (local && isDirty(rm.id)) continue;                 // my unpushed edits win until pushed
    if (local && s && s.rev === rm.rev) continue;          // already up to date
    if (local && !s && (local.updated || 0) > (rm.updated || 0)) { // same id, never linked, mine is newer
      syncMap[rm.id] = { rev: rm.rev, imageRev: rm.imageRev };
      markDirty(rm.id, true);
      continue;
    }
    if (local && local === cur && uiBusy()) continue;      // don't yank the screen mid-edit; retry next cycle
    const { nb, rev, imageRev } = await fetchRemoteBoard(rm.id, local, s);
    await localPut(nb);
    syncMap[nb.id] = { rev, imageRev };
    if (local) {
      dropUrl(local);
      boards[boards.indexOf(local)] = nb;
      if (cur === local) { cur = nb; curReplaced = true; }
    } else boards.push(nb);
    changed = true;
  }

  // 2) local boards the server doesn't have
  for (const b of [...boards]) {
    if (rmap.has(b.id)) continue;
    if (syncMap[b.id] && !isDirty(b.id)) { await dropLocal(b); changed = true; }   // deleted by someone else
    else if (!syncMap[b.id] && !isDirty(b.id) && !isBlankStarter(b)) markDirty(b.id, true); // never uploaded
  }

  // 3) drop the blank starter board once the cloud has real templates
  const st = boards.find(b => b.id === localStorage.getItem('tre_starter'));
  if (st && remote.length && boards.length > 1 && !st.image && !st.regions.length && !syncMap[st.id] && !uiBusy()) {
    await dropLocal(st); changed = true;
  }

  persistSync();
  if (changed) {
    if (!boards.length) {
      const n = newBoard('Untitled template'); boards = [n];
      localStorage.setItem('tre_starter', n.id); await dbPut(n);
    }
    sortBoards();
    if (!boards.includes(cur)) {
      setCurrent(boards[0]);
      view = boards.length > 1 ? 'library' : 'editor';
      mode = cur.image ? 'view' : 'edit';
    } else if (curReplaced) {
      resetHistory(); imgVersion++;
      if (selId && !getSel()) selId = null;
      toast('Updated from the cloud');
    }
    render(true);
  }
}

async function pushAll() {
  for (const id of [...tomb]) {
    const r = await api('/api/boards/' + id, { method: 'DELETE' });
    if (r.status === 401) throw authErr();
    if (r.ok || r.status === 404) { tomb = tomb.filter(x => x !== id); persistSync(); }
    else throw new Error('delete failed ' + r.status);
  }
  for (const id of Object.keys(dirty)) {
    if (!isDirty(id)) { delete dirty[id]; continue; }
    const b = boards.find(x => x.id === id);
    if (!b || isBlankStarter(b)) { delete dirty[id]; continue; }
    await pushBoard(b);
  }
  persistSync();
}

async function shrinkBlob(blob) {
  const url = URL.createObjectURL(blob);
  try {
    const img = await loadImg(url);
    let k = 1, q = .85, out = blob;
    for (let i = 0; i < 8 && out.size > MAX_IMG_BYTES; i++) {
      out = await canvasBlob(img, Math.round(img.naturalWidth * k), Math.round(img.naturalHeight * k), q);
      if (q > .7) q -= .075; else k *= .85;
    }
    return out;
  } finally { URL.revokeObjectURL(url); }
}

async function pushBoard(b) {
  const d = dirty[b.id];
  const isNew = !syncMap[b.id];

  if (d.m > 0) {
    const sm = d.m;
    const body = Object.assign({}, clean(b));
    delete body.image;
    body.baseRev = (syncMap[b.id] && syncMap[b.id].rev) || 0;
    const r = await api('/api/boards/' + b.id, {
      method: 'PUT', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body)
    });
    if (r.status === 401) throw authErr();
    if (r.status === 409) return resolveConflict(b);
    if (r.status === 404) { delete syncMap[b.id]; return pushBoard(b); }   // deleted remotely: re-create
    if (!r.ok) throw new Error('save failed ' + r.status);
    const j = await r.json();
    syncMap[b.id] = Object.assign(syncMap[b.id] || { imageRev: 0 }, { rev: j.rev });
    if (d.m === sm) d.m = 0;
    if (isNew && b.image instanceof Blob) d.i = Math.max(d.i, 1);
  }

  if (d.i > 0) {
    if (!(b.image instanceof Blob)) d.i = 0;
    else {
      const si = d.i;
      const payload = b.image.size > MAX_IMG_BYTES ? await shrinkBlob(b.image) : b.image;
      const r = await api(`/api/boards/${b.id}/image?baseRev=${syncMap[b.id].rev}`, {
        method: 'PUT', headers: { 'content-type': payload.type || 'image/jpeg' }, body: payload
      });
      if (r.status === 401) throw authErr();
      if (r.status === 409) return resolveConflict(b);
      if (r.status === 404) { delete syncMap[b.id]; return pushBoard(b); }
      if (!r.ok) throw new Error('image save failed ' + r.status);
      const j = await r.json();
      syncMap[b.id].rev = j.rev; syncMap[b.id].imageRev = j.imageRev;
      if (d.i === si) d.i = 0;
    }
  }
  if (!isDirty(b.id)) delete dirty[b.id];
  persistSync();
}

async function resolveConflict(b) {
  const mine = confirm(`"${b.name || 'Untitled'}" was changed by someone else since you last synced.\n\nOK = overwrite it with MY version\nCancel = discard my changes and load THEIRS`);
  if (mine) {
    const r = await api('/api/boards/' + b.id);
    if (r.status === 404) { delete syncMap[b.id]; return pushBoard(b); }
    if (!r.ok) throw new Error('conflict lookup failed');
    const d = await r.json();
    syncMap[b.id] = { rev: d.rev, imageRev: d.imageRev || 0 };
    return pushBoard(b);
  }
  delete dirty[b.id];
  syncMap[b.id] = { rev: -1, imageRev: -1 };   // forces a re-download on the next pull
  persistSync();
  again = true;
}

function cloudInit() {
  const p = $('#syncPill'); if (p) p.onclick = syncNow;
  syncNow();
  clearInterval(pollT);
  pollT = setInterval(() => { if (!document.hidden && navigator.onLine) syncNow(); }, 60000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) syncNow(); });
  window.addEventListener('online', syncNow);
}

/* ---------- image helpers ---------- */
const loadImg=src=>new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('image load failed'));i.src=src;});
function dataURLtoBlob(u){const [h,d]=u.split(',');const mime=(h.match(/:(.*?);/)||[])[1]||'image/jpeg';const bin=atob(d);const a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return new Blob([a],{type:mime});}
const blobToDataURL=b=>new Promise((res,rej)=>{const f=new FileReader();f.onload=()=>res(f.result);f.onerror=rej;f.readAsDataURL(b);});
function canvasBlob(img,w,h,q){return new Promise((res,rej)=>{const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(img,0,0,w,h);c.toBlob(b=>b?res(b):rej(new Error('encode failed')),'image/jpeg',q);});}
function thumbURL(img,max=360){const k=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));const w=Math.max(1,Math.round(img.naturalWidth*k)),h=Math.max(1,Math.round(img.naturalHeight*k));const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(img,0,0,w,h);return c.toDataURL('image/jpeg',.72);}
async function processImage(file){
  const url=URL.createObjectURL(file);
  try{
    const img=await loadImg(url);
    const ow=img.naturalWidth,oh=img.naturalHeight;
    let k=Math.min(1,cfg.maxDim()/Math.max(ow,oh)),q=.92,w=ow,h=oh,blob=null;
    for(let i=0;i<8;i++){
      w=Math.max(1,Math.round(ow*k));h=Math.max(1,Math.round(oh*k));
      blob=await canvasBlob(img,w,h,q);
      if(blob.size<=MAX_IMG_BYTES)break;
      if(q>.72)q-=.1;else k*=.85;

    return {blob,thumb:thumbURL(img),w,h,ow,oh};

}
function urlOf(b){if(!b.image)return '';if(!b._url)b._url=URL.createObjectURL(b.image);return b._url;}
function dropUrl(b){if(b._url){URL.revokeObjectURL(b._url);b._url=null;}}
function applyImage(b,p){
  markImgDirty(b.id);
  dropUrl(b);b.image=p.blob;b.thumb=p.thumb;b.imgW=p.w;b.imgH=p.h;b.origW=p.ow;b.origH=p.oh;
  if(b.canvasAuto!==false){b.canvasAuto=true;b.canvas={w:p.ow,h:p.oh};}

/* ---------- arrows: geometry helpers ---------- */
/* An arrow is a normal element (kind:'arrow'). It has a bounding box (x,y,w,h in %)
   plus ap = [startX,startY,endX,endY] as % of that box. Its angle is baked into the end points. */
const SVGNS='http://www.w3.org/2000/svg';
function sv(tag,at,parent){
  const n=document.createElementNS(SVGNS,tag);
  for(const k in at)n.setAttribute(k,at[k]);
  if(parent)parent.appendChild(n);
  return n;
}
function arrowBox(sx,sy,ex,ey){
  const MINP=2;
  const w=Math.max(Math.abs(ex-sx),MINP),h=Math.max(Math.abs(ey-sy),MINP);
  const x=clamp((sx+ex)/2-w/2,0,100-w),y=clamp((sy+ey)/2-h/2,0,100-h);
  return {x,y,w,h,ap:[(sx-x)/w*100,(sy-y)/h*100,(ex-x)/w*100,(ey-y)/h*100].map(v=>+v.toFixed(2))};
}
function setArrowPts(r,s,e){
  s=s.map(v=>clamp(v,0,100));e=e.map(v=>clamp(v,0,100));
  const o=arrowBox(s[0],s[1],e[0],e[1]);
  r.x=o.x;r.y=o.y;r.w=o.w;r.h=o.h;r.ap=o.ap;
}
function arrowPts(r){
  const a=(r.ap&&r.ap.length===4)?r.ap:[0,50,100,50];
  return [[r.x+a[0]/100*r.w,r.y+a[1]/100*r.h],[r.x+a[2]/100*r.w,r.y+a[3]/100*r.h]];
}
function arrowMetrics(r,b){
  const a=(r.ap&&r.ap.length===4)?r.ap:[0,50,100,50];
  const vx=(a[2]-a[0])/100*r.w,vy=(a[3]-a[1])/100*r.h;   // % of canvas
  const len=Math.hypot(vx/100*b.canvas.w,vy/100*b.canvas.h);
  const ang=Math.atan2(vy/100*IH(b),vx/100*IW(b))*180/Math.PI;
  return {len:Math.round(len),ang:Math.round(ang*10)/10};
}
function rotArrow(r,deg,b){
  const W=IW(b),H=IH(b),pts=arrowPts(r);
  const P=p=>[p[0]*W/100,p[1]*H/100],Q=p=>[p[0]/W*100,p[1]/H*100];
  const ps=P(pts[0]),pe=P(pts[1]),m=[(ps[0]+pe[0])/2,(ps[1]+pe[1])/2];
  const t=deg*Math.PI/180,c=Math.cos(t),sn=Math.sin(t);
  const R=p=>{const dx=p[0]-m[0],dy=p[1]-m[1];return Q([m[0]+dx*c-dy*sn,m[1]+dx*sn+dy*c]);};
  setArrowPts(r,R(ps),R(pe));
}
function rotateBy(r,dd){
  if(r.kind==='arrow')rotArrow(r,dd,cur);
  else r.rot=+normDeg((r.rot||0)+dd).toFixed(1);
}
/* geometry in px units of the image, local to the arrow's bounding box */
function arrowGeom(r,W,H){
  const bw=r.w/100*W,bh=r.h/100*H,a=(r.ap&&r.ap.length===4)?r.ap:[0,50,100,50];
  const s=[a[0]/100*bw,a[1]/100*bh],e=[a[2]/100*bw,a[3]/100*bh];
  const dx=e[0]-s[0],dy=e[1]-s[1],len=Math.hypot(dx,dy),sw=Math.max(1.5,W*.004);
  if(len<sw*4)return null;
  const k=r.curve||0,c=[(s[0]+e[0])/2-dy*k,(s[1]+e[1])/2+dx*k];
  let ux=e[0]-c[0],uy=e[1]-c[1],ul=Math.hypot(ux,uy);
  if(!ul){ux=dx;uy=dy;ul=len;}
  ux/=ul;uy/=ul;
  const hl=Math.min(sw*5.5,len*.5),hw=hl*.5,bs=[e[0]-ux*hl,e[1]-uy*hl],nx=-uy,ny=ux;
  return {sw,d:`M${s[0]} ${s[1]}Q${c[0]} ${c[1]} ${bs[0]} ${bs[1]}`,

  sv('path',{class:'hl',d:g.d,fill:'none',stroke:col,'stroke-width':sw*4,'stroke-linecap':'round'},grp);
  sv('path',{d:g.d,fill:'none',stroke:'#fff','stroke-opacity':.9,'stroke-width':sw*2.4,'stroke-linecap':'round'},grp);
  sv('polygon',{points:pts,fill:'#fff',stroke:'#fff','stroke-opacity':.9,'stroke-width':sw*1.4,'stroke-linejoin':'round'},grp);
  const line={d:g.d,fill:'none',stroke:col,'stroke-width':sw,'stroke-linecap':'round'};
  if(r.dash)line['stroke-dasharray']=`${sw*3} ${sw*2.2}`;
  sv('path',line,grp);
  sv('polygon',{points:pts,fill:col,stroke:col,'stroke-width':sw*.4,'stroke-linejoin':'round'},grp);
  if(hit){
    sv('path',{class:'hit',d:g.d,fill:'none',stroke:'transparent','stroke-width':Math.max(sw*5,W*.012),'stroke-linecap':'round'},grp);
    sv('polygon',{class:'hit',points:pts,fill:'transparent',stroke:'transparent','stroke-width':sw*3},grp);

function paintArrow(el,r,b){
  el.classList.add('arw');
  const old=el.querySelector(':scope > svg.arwsvg');if(old)old.remove();
  const W=IW(b),H=IH(b);
  const s=document.createElementNS(SVGNS,'svg');
  s.setAttribute('class','arwsvg');

  s.setAttribute('preserveAspectRatio','none');

function placeArrowHandles(el,r){
  const a=(r.ap&&r.ap.length===4)?r.ap:[0,50,100,50];
  const h1=el.querySelector('.handle[data-h="a1"]'),h2=el.querySelector('.handle[data-h="a2"]');

  if(h2){h2.style.left=a[2]+'%';h2.style.top=a[3]+'%';}

/* Old versions stored connector arrows on the board; turn them into real elements */
function convertOldArrows(b){
  const old=b.arrows;
  if(old===undefined)return false;
  delete b.arrows;
  if(!Array.isArray(old)||!old.length)return true;
  const rc=id=>b.regions.find(q=>q.id===id);
  const edge=(R,p)=>{const cx=R.x+R.w/2,cy=R.y+R.h/2,dx=p[0]-cx,dy=p[1]-cy;if(!dx&&!dy)return [cx,cy];const t=Math.min(dx?R.w/2/Math.abs(dx):Infinity,dy?R.h/2/Math.abs(dy):Infinity);return t>=1?[cx,cy]:[cx+dx*t,cy+dy*t];};
  let n=Math.max(0,...b.regions.map(r=>parseInt(r.num,10)||0));
  old.forEach(a=>{
    const A=rc(a.from),B=rc(a.to);
    const cA=A?[A.x+A.w/2,A.y+A.h/2]:[+a.x1||0,+a.y1||0],cB=B?[B.x+B.w/2,B.y+B.h/2]:[+a.x2||0,+a.y2||0];
    const s=A?edge(A,cB):cA,e=B?edge(B,cA):cB;
    const r={id:a.id||uid(),x:0,y:0,w:2,h:2,num:String(++n),label:a.label||'',feed:'',type:(b.types&&b.types[0])||'Element',concept:'Both',notes:'',t0:'',t1:'',rot:0,fields:[],
      kind:'arrow',curve:+a.curve||0,dash:!!a.dash,color:/^#[0-9a-f]{6}$/i.test(a.color||'')?a.color:ARROW_COL,target:B?B.id:''};
    setArrowPts(r,s,e);
    b.regions.push(r);
  });
  return true;
}

/* ---------- migration (keeps boards from older versions) ---------- */
async function migrate(b){
  let ch=false;
  if(!Array.isArray(b.regions)){b.regions=[];ch=true;}
  if(!Array.isArray(b.types)||!b.types.length){b.types=['Element','Controller'];ch=true;}
  if(!Array.isArray(b.fieldNames)){b.fieldNames=[];ch=true;}
  if(typeof b.image==='string'&&b.image){try{b.image=dataURLtoBlob(b.image);b.imgW=0;ch=true;}catch(e){b.image=null;}}
  if(b.image instanceof Blob&&(!b.imgW||!b.thumb)){
    const url=URL.createObjectURL(b.image);
    try{const img=await loadImg(url);b.imgW=img.naturalWidth;b.imgH=img.naturalHeight;b.origW=b.origW||b.imgW;b.origH=b.origH||b.imgH;b.thumb=thumbURL(img);ch=true;}
    catch(e){b.image=null;}
    finally{URL.revokeObjectURL(url);}
  }
  if(!b.image&&b.image!==null){b.image=null;}
  if(!b.canvas){b.canvas={w:b.origW||b.imgW||1080,h:b.origH||b.imgH||1080};ch=true;}
  if(b.canvasAuto===undefined){b.canvasAuto=true;ch=true;}
  b.regions.forEach(r=>{if(!Array.isArray(r.fields))r.fields=[];if(!r.type)r.type=b.types[0];if(r.num===undefined)r.num='';});
  if(convertOldArrows(b))ch=true;
  if(ch)await dbPut(b);
  return b;
}

async function boot(){
  try{boards=await dbGetAll();}catch(e){boards=[];}

}

    <label class="opt">Match by <select data-bar="cmpBy"><option value="label"${cmpBy==='label'?' selected':''}>Label</option><option value="num"${cmpBy==='num'?' selected':''}>Number</option></select></label>
    <label class="opt"><input type="checkbox" data-bar="cmpDiff"${cmpDiff?' checked':''}> Differences only</label>
    <label class="opt">Width <input type="range" min="180" max="700" step="10" data-bar="colW" value="${prefs.colW}"></label>
    <label class="opt"><input type="checkbox" data-bar="labels"${prefs.labels?' checked':''}> Labels</label>`;
  }
  $('#bar').innerHTML=h;updateZoomLabel();
}

$('#bar').addEventListener('click',e=>{
  const a=e.target.closest('[data-act]');if(!a)return;
  const act=a.dataset.act;
  if(act==='newBoard')newBoardModal();
  else if(act==='newVideo')newVideoModal();
  else if(act==='dup')duplicateBoard(cur);
  else if(act==='boardSettings')boardSettingsModal();
  else if(act==='zoomIn')setZoom(effZoom()*1.2);
  else if(act==='zoomOut')setZoom(effZoom()/1.2);
  else if(act==='zoomFit'){zoom='fit';applyZoom();}
  else if(act==='zoom100')setZoom(1);
  else if(act==='uploadMany')pickFiles(true,createFromFiles);

    if(picked.size>MAXCMP)toast(`Comparing the first ${MAXCMP} of ${picked.size}`);

  }

});
$('#bar').addEventListener('input',e=>{
  const t=e.target,k=t.dataset.bar;if(!k)return;
  if(k==='board'){const b=boards.find(x=>x.id===t.value);if(b)openBoard(b);}
  else if(k==='snap'){prefs.snap=+t.value;savePrefs();}
  else if(k==='tool'){tool=t.value;prefs.tool=tool;savePrefs();}
  else if(k==='labels'){prefs.labels=t.checked;savePrefs();$$('.canvas').forEach(c=>c.classList.toggle('labels',prefs.labels));}
  else if(k==='search'){libSearch=t.value;renderLibrary();}
  else if(k==='sort'){libSort=t.value;renderLibrary();}
  else if(k==='kind'){libKind=t.value;renderLibrary();}
  else if(k==='cmpAdd'){if(t.value){cmpIds.push(t.value);render(true);}}
  else if(k==='cmpBy'){cmpBy=t.value;cmpSel=null;render(true);}

});

/* ---------- zoom / scaling ---------- */
function effZoom(){
  if(!cur||!cur.image)return 1;
  if(zoom!=='fit')return zoom;
  const st=$('#stage'),aw=Math.max(120,st.clientWidth-62),ah=Math.max(120,st.clientHeight-62);
  const W=Math.min(aw,ah*cur.imgW/cur.imgH);
  return W/cur.canvas.w;
}
function updateZoomLabel(){const l=$('#zoomLbl');if(l)l.textContent=Math.round(effZoom()*100)+'%';}
function applyZoom(){
  const c=$('#stage .canvas');if(!c||view!=='editor')return;
  c.style.width=Math.floor(cur.canvas.w*effZoom())+'px';updateZoomLabel();
}
function setZoom(z){
  const st=$('#stage');if(view!=='editor'||!cur.image)return;
  const fx=(st.scrollLeft+st.clientWidth/2)/(st.scrollWidth||1),fy=(st.scrollTop+st.clientHeight/2)/(st.scrollHeight||1);
  zoom=clamp(z,.05,6);applyZoom();
  st.scrollLeft=fx*st.scrollWidth-st.clientWidth/2;st.scrollTop=fy*st.scrollHeight-st.clientHeight/2;
}
$('#stage').addEventListener('wheel',e=>{
  if(view!=='editor'||!(e.ctrlKey||e.metaKey)||!cur.image)return;
  e.preventDefault();setZoom(effZoom()*(e.deltaY<0?1.1:1/1.1));
},{passive:false});
new ResizeObserver(()=>{if(view==='editor'&&zoom==='fit')applyZoom();}).observe($('#stage'));

/* ---------- editor stage ---------- */
function renderEditor(force){
  const st=$('#stage'),key=`ed|${cur.id}|${imgVersion}|${mode}`;
  if(force||st.dataset.key!==key){
    st.dataset.key=key;st.className='ed';st.innerHTML='';
    if(!cur.image){
      const dz=document.createElement('div');dz.className='dropzone';
      dz.innerHTML=cur.vid
        ?'<div class="dz-icon">▶</div><h2>Capture a frame from your video</h2><p>Click here (in Edit mode) to load the video and capture scenes, or drop an image</p>'
        :'<div class="dz-icon">▤</div><h2>Drop an ad mockup here</h2><p>or click to upload · you can also paste an image (Ctrl+V)</p>';
      dz.onclick=()=>{if(cur.vid){if(mode==='edit')captureModal();else toast('Switch to Edit mode to capture frames');}else pickFiles(false,f=>loadImageFile(f[0]));};
      st.appendChild(dz);
    }else{
      const cv=document.createElement('div');cv.className='canvas'+(prefs.labels?' labels':'');
      const img=new Image();img.src=urlOf(cur);img.alt='';img.draggable=false;
      const ov=document.createElement('div');ov.id='overlay';ov.className='overlay'+(mode==='edit'?' edit':'');
      if(mode==='edit')attachDraw(ov);else ov.addEventListener('click',e=>{if(e.target===ov)selectRegion(null);});
      cv.append(img,ov);st.appendChild(cv);applyZoom();
    }
  }
  renderRegions();
}
function renderRegions(){
  const ov=$('#overlay');if(!ov)return;
  ov.innerHTML='';
  [...cur.regions].sort((a,b)=>b.w*b.h-a.w*a.h).forEach(r=>ov.appendChild(regionEl(r,cur)));
  updateSelectionClasses();
}
function updateSelectionClasses(){
  $$('.region[data-id]').forEach(el=>{
    const on=view==='compare'?(cmpSel!==null&&el.dataset.key===cmpSel):el.dataset.id===selId;
    el.classList.toggle('is-selected',on);
  });
  $$('.canvas').forEach(c=>c.classList.toggle('has-sel',view==='compare'?cmpSel!==null:(mode==='view'&&!!selId)));
}
function selectRegion(id){selId=id;updateSelectionClasses();renderPanel();}

function setRect(el,r,b=cur){
  el.style.left=r.x+'%';el.style.top=r.y+'%';el.style.width=r.w+'%';el.style.height=r.h+'%';
  el.style.setProperty('--rot',(r.rot||0)+'deg');
  const d=el.querySelector('.dim');
  if(d){
    if(r.kind==='arrow'){const m=arrowMetrics(r,b);d.textContent=m.len+' px · '+m.ang+'°';}
    else d.textContent=Math.round(r.w*b.canvas.w/100)+' × '+Math.round(r.h*b.canvas.h/100)+' px'+(r.rot?' · '+r.rot+'°':'');
  }
  if(r.kind==='arrow'){paintArrow(el,r,b);placeArrowHandles(el,r);}
}
function refreshRegionEl(r){
  const el=$(`.region[data-id="${r.id}"]`);if(!el)return;
  el.style.setProperty('--c',regColor(cur,r));
  el.title=[r.label,r.feed].filter(Boolean).join(' — ');
  $('.badge b',el).textContent=r.num||'';$('.badge i',el).textContent=r.label||'';
  if(r.kind==='arrow')paintArrow(el,r,cur);
}

/* snap */
function snapV(v,axis){
  if(!prefs.snap)return v;
  const size=axis==='x'?cur.canvas.w:cur.canvas.h;
  return clamp(Math.round(v/100*size/prefs.snap)*prefs.snap/size*100,0,100);
}

/* resize a rotated box (all maths in screen px so the opposite edge stays put) */
function resizeRot(o,k,dxp,dyp,Ow,Oh){
  const th=(o.rot||0)*Math.PI/180,c=Math.cos(th),s=Math.sin(th),MINPX=8;
  const w=o.w/100*Ow,h=o.h/100*Oh,cx=(o.x+o.w/2)/100*Ow,cy=(o.y+o.h/2)/100*Oh;
  const lx=dxp*c+dyp*s,ly=-dxp*s+dyp*c;
  let nw=w,nh=h,sx=0,sy=0;
  if(k.includes('e')){nw=Math.max(MINPX,w+lx);sx=(nw-w)/2;}
  if(k.includes('w')){nw=Math.max(MINPX,w-lx);sx=-(nw-w)/2;}
  if(k.includes('s')){nh=Math.max(MINPX,h+ly);sy=(nh-h)/2;}
  if(k.includes('n')){nh=Math.max(MINPX,h-ly);sy=-(nh-h)/2;}
  const ncx=cx+sx*c-sy*s,ncy=cy+sx*s+sy*c;
  return {x:(ncx-nw/2)/Ow*100,y:(ncy-nh/2)/Oh*100,w:nw/Ow*100,h:nh/Oh*100};
}

function regionEl(reg,b,opt={}){
  const d=document.createElement('div');
  d.className='region';d.dataset.id=reg.id;d.dataset.key=keyOf(reg);
  d.style.setProperty('--c',regColor(b,reg));
  d.title=[reg.label,reg.feed].filter(Boolean).join(' — ');
  d.innerHTML=`<span class="badge"><b>${esc(reg.num||'')}</b><i>${esc(reg.label||'')}</i></span><span class="dim"></span>`;
  setRect(d,reg,b);shapeInto(d,reg);

  if(opt.compare){
    d.addEventListener('click',e=>{e.stopPropagation();cmpSel=cmpSel===d.dataset.key?null:d.dataset.key;updateSelectionClasses();renderPanel();});
    return d;
  }
  if(mode==='view'){
    d.addEventListener('click',e=>{e.stopPropagation();selectRegion(selId===reg.id?null:reg.id);});
    return d;
  }
  const isA=reg.kind==='arrow';
  (isA?['a1','a2']:['nw','n','ne','e','se','s','sw','w']).forEach(c=>{const h=document.createElement('div');h.className='handle';h.dataset.h=c;d.appendChild(h);});
  const rh=document.createElement('div');rh.className='rot-h';rh.dataset.h='rot';rh.title='Drag to rotate (hold Shift for 15° steps)';d.appendChild(rh);
  if(isA)placeArrowHandles(d,reg);

  d.addEventListener('pointerdown',e=>{
    if(e.button!==0)return;
    if(e.shiftKey&&!(e.target.dataset&&e.target.dataset.h)){startDraw(e);return;} // Shift = draw a new one on top of this
    e.stopPropagation();e.preventDefault();
    if(selId!==reg.id)selectRegion(reg.id);
    const o={x:reg.x,y:reg.y,w:reg.w,h:reg.h,rot:reg.rot||0,ap:reg.ap?reg.ap.slice():null};
    let cx=o.x+o.w/2,cy=o.y+o.h/2;
    if(isA&&o.ap&&o.ap.length===4){cx=o.x+(o.ap[0]+o.ap[2])/200*o.w;cy=o.y+(o.ap[1]+o.ap[3])/200*o.h;}
    drag={kind:(e.target.dataset&&e.target.dataset.h)||'move',reg,el:d,rect:$('#overlay').getBoundingClientRect(),sx:e.clientX,sy:e.clientY,o,cx,cy};
    d.classList.add('dragging');
    try{e.target.setPointerCapture(e.pointerId);}catch(_){}
  });
  d.addEventListener('pointermove',e=>{
    if(!drag||drag.el!==d)return;
    const r=drag.reg,o=drag.o,k=drag.kind,rc=drag.rect;
    const dx=(e.clientX-drag.sx)/rc.width*100,dy=(e.clientY-drag.sy)/rc.height*100;
    if(k==='rot'){
      const cxp=rc.left+drag.cx/100*rc.width,cyp=rc.top+drag.cy/100*rc.height;
      let dd=(Math.atan2(e.clientY-cyp,e.clientX-cxp)-Math.atan2(drag.sy-cyp,drag.sx-cxp))*180/Math.PI;
      if(isA){
        if(e.shiftKey)dd=Math.round(dd/15)*15;
        const t={x:o.x,y:o.y,w:o.w,h:o.h,ap:o.ap.slice()};
        rotArrow(t,dd,b);
        r.x=t.x;r.y=t.y;r.w=t.w;r.h=t.h;r.ap=t.ap;
      }else{
        let v=o.rot+dd;if(e.shiftKey)v=Math.round(v/15)*15;
        r.rot=+normDeg(v).toFixed(1);
      }
    }else if(k==='a1'||k==='a2'){
      const ps=[{x:o.x+o.ap[0]/100*o.w,y:o.y+o.ap[1]/100*o.h},{x:o.x+o.ap[2]/100*o.w,y:o.y+o.ap[3]/100*o.h}];
      const mv=k==='a1'?0:1,ot=ps[1-mv];
      let qx=snapV(clamp((e.clientX-rc.left)/rc.width*100,0,100),'x'),qy=snapV(clamp((e.clientY-rc.top)/rc.height*100,0,100),'y');
      if(e.shiftKey){
        const W=IW(b),H=IH(b),vx=(qx-ot.x)*W/100,vy=(qy-ot.y)*H/100,L=Math.hypot(vx,vy),st=Math.PI/12,an=Math.round(Math.atan2(vy,vx)/st)*st;
        qx=clamp(ot.x+Math.cos(an)*L/W*100,0,100);qy=clamp(ot.y+Math.sin(an)*L/H*100,0,100);
      }
      const A=mv===0?[qx,qy]:[ps[0].x,ps[0].y],B=mv===1?[qx,qy]:[ps[1].x,ps[1].y];
      setArrowPts(r,A,B);
    }else if(k==='move'){
      r.x=clamp(snapV(o.x+dx,'x'),0,100-o.w);r.y=clamp(snapV(o.y+dy,'y'),0,100-o.h);
    }else if(o.rot){
      const n=resizeRot(o,k,e.clientX-drag.sx,e.clientY-drag.sy,rc.width,rc.height);
      r.x=n.x;r.y=n.y;r.w=Math.max(MIN,n.w);r.h=Math.max(MIN,n.h);
    }else{
      let x1=o.x,y1=o.y,x2=o.x+o.w,y2=o.y+o.h;
      if(k.includes('w'))x1=clamp(snapV(x1+dx,'x'),0,x2-MIN);
      if(k.includes('e'))x2=clamp(snapV(x2+dx,'x'),x1+MIN,100);
      if(k.includes('n'))y1=clamp(snapV(y1+dy,'y'),0,y2-MIN);
      if(k.includes('s'))y2=clamp(snapV(y2+dy,'y'),y1+MIN,100);
      r.x=x1;r.y=y1;r.w=x2-x1;r.h=y2-y1;
    }
    setRect(d,r,b);syncPx(r);
  });
  const end=()=>{if(drag&&drag.el===d){d.classList.remove('dragging');drag=null;checkpoint();}};
  d.addEventListener('pointerup',end);d.addEventListener('pointercancel',end);
  return d;
}

/* ---------- drawing (rectangle, freehand, arrow) ---------- */
const ptOf=(e,r)=>({x:snapV(clamp((e.clientX-r.left)/r.width*100,0,100),'x'),y:snapV(clamp((e.clientY-r.top)/r.height*100,0,100),'y')});
const normRect=(a,b)=>({x:Math.min(a.x,b.x),y:Math.min(a.y,b.y),w:Math.abs(b.x-a.x),h:Math.abs(b.y-a.y)});

let tool=['free','arrow'].includes(prefs.tool)?prefs.tool:'rect';
const FREE_EPS=3;   // higher = smoother, fewer points

function rdp(p,eps){
  if(p.length<3)return p;
  const a=p[0],b=p[p.length-1],dx=b[0]-a[0],dy=b[1]-a[1],L=Math.hypot(dx,dy);
  let md=0,mi=0;
  for(let i=1;i<p.length-1;i++){
    const d=L?Math.abs(dy*p[i][0]-dx*p[i][1]+b[0]*a[1]-b[1]*a[0])/L:Math.hypot(p[i][0]-a[0],p[i][1]-a[1]);
    if(d>md){md=d;mi=i;}
  }
  if(md>eps){const l=rdp(p.slice(0,mi+1),eps),r=rdp(p.slice(mi),eps);return l.slice(0,-1).concat(r);}
  return [a,b];
}
function ptsPath(pts,sx=1,sy=1,ox=0,oy=0){
  const n=pts.length;if(n<3)return '';
  const P=pts.map(p=>[ox+p[0]*sx,oy+p[1]*sy]),mid=(a,b)=>[(a[0]+b[0])/2,(a[1]+b[1])/2];
  const m0=mid(P[n-1],P[0]);
  let d=`M${m0[0]} ${m0[1]}`;
  for(let i=0;i<n;i++){const m=mid(P[i],P[(i+1)%n]);d+=`Q${P[i][0]} ${P[i][1]} ${m[0]} ${m[1]}`;}
  return d+'Z';
}
function shapeInto(d,reg){
  if(!Array.isArray(reg.pts)||reg.pts.length<3)return;
  d.classList.add('shaped');
  const s=document.createElementNS(SVGNS,'svg');
  s.setAttribute('class','shp');s.setAttribute('viewBox','0 0 100 100');s.setAttribute('preserveAspectRatio','none');
  const p=document.createElementNS(SVGNS,'path');p.setAttribute('d',ptsPath(reg.pts));
  s.appendChild(p);d.insertBefore(s,d.firstChild);
}

function arrowEnd(d,e){
  let p=ptOf(e,d.rect);
  if(e.shiftKey){
    const vx=(p.x-d.s.x)/100*d.rect.width,vy=(p.y-d.s.y)/100*d.rect.height,L=Math.hypot(vx,vy),st=Math.PI/12,an=Math.round(Math.atan2(vy,vx)/st)*st;
    p={x:clamp(d.s.x+Math.cos(an)*L/d.rect.width*100,0,100),y:clamp(d.s.y+Math.sin(an)*L/d.rect.height*100,0,100)};
  }
  return p;
}
function liveArrow(d){
  d.el.innerHTML='';
  const o=arrowBox(d.s.x,d.s.y,d.e.x,d.e.y);
  const g=sv('g',{transform:`translate(${o.x/100*d.rect.width} ${o.y/100*d.rect.height})`},d.el);
  arrowSvgInto(g,{x:o.x,y:o.y,w:o.w,h:o.h,ap:o.ap,curve:0,dash:false},ARROW_COL,d.rect.width,d.rect.height,false);
}
function finishArrow(d){
  const px=Math.hypot((d.e.x-d.s.x)/100*d.rect.width,(d.e.y-d.s.y)/100*d.rect.height);
  if(px<14){selectRegion(null);return;}   // a short click just deselects
  const o=arrowBox(d.s.x,d.s.y,d.e.x,d.e.y);
  addRegion({x:o.x,y:o.y,w:o.w,h:o.h},{kind:'arrow',ap:o.ap,curve:0,dash:false,color:ARROW_COL,target:''});
}

function startDraw(e){
  const ov=$('#overlay');if(!ov)return;
  e.preventDefault();
  const rect=ov.getBoundingClientRect(),col=typeColor(cur,cur.types[0]);
  if(tool==='arrow'){
    const svg=document.createElementNS(SVGNS,'svg');
    svg.setAttribute('class','livefree');svg.setAttribute('viewBox',`0 0 ${rect.width} ${rect.height}`);
    ov.appendChild(svg);
    const s=ptOf(e,rect);
    draw={arrow:true,s,e:s,rect,el:svg};
    try{ov.setPointerCapture(e.pointerId);}catch(_){}
    return;
  }
  if(tool==='free'){
    const svg=document.createElementNS(SVGNS,'svg');
    svg.setAttribute('class','livefree');svg.setAttribute('viewBox',`0 0 ${rect.width} ${rect.height}`);
    const path=document.createElementNS(SVGNS,'path');
    path.setAttribute('style',`fill:${col};fill-opacity:.12;stroke:${col};stroke-width:2;stroke-dasharray:5 4;stroke-linejoin:round;stroke-linecap:round`);
    svg.appendChild(path);ov.appendChild(svg);
    draw={free:true,pts:[[e.clientX-rect.left,e.clientY-rect.top]],rect,el:svg,path};
    try{ov.setPointerCapture(e.pointerId);}catch(_){}
    return;
  }
  const s=ptOf(e,rect);
  const el=document.createElement('div');el.className='region live';el.style.setProperty('--c',col);
  el.innerHTML='<span class="dim"></span>';setRect(el,{x:s.x,y:s.y,w:0,h:0});ov.appendChild(el);
  draw={s,rect,el};
  try{ov.setPointerCapture(e.pointerId);}catch(_){}
}
function finishFree(d){
  if(d.pts.length<4){selectRegion(null);return;}
  let eps=FREE_EPS,s=rdp(d.pts,eps);
  while(s.length>120){eps*=1.4;s=rdp(d.pts,eps);}
  if(s.length<3){selectRegion(null);return;}
  const xs=s.map(p=>p[0]),ys=s.map(p=>p[1]);
  const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
  const W=d.rect.width,H=d.rect.height,bw=(x1-x0)/W*100,bh=(y1-y0)/H*100;
  if(bw<=MIN*1.2||bh<=MIN*1.2){selectRegion(null);return;}
  const rel=s.map(p=>[+((p[0]-x0)/(x1-x0)*100).toFixed(2),+((p[1]-y0)/(y1-y0)*100).toFixed(2)]);
  addRegion({x:x0/W*100,y:y0/H*100,w:bw,h:bh},{pts:rel});
}
function attachDraw(ov){
  ov.addEventListener('pointerdown',e=>{if(e.target===ov&&e.button===0)startDraw(e);});
  ov.addEventListener('pointermove',e=>{
    if(!draw)return;
    if(draw.arrow){draw.e=arrowEnd(draw,e);liveArrow(draw);return;}
    if(draw.free){
      const x=clamp(e.clientX-draw.rect.left,0,draw.rect.width),y=clamp(e.clientY-draw.rect.top,0,draw.rect.height),l=draw.pts[draw.pts.length-1];
      if(Math.hypot(x-l[0],y-l[1])<2)return;
      draw.pts.push([x,y]);
      draw.path.setAttribute('d','M'+draw.pts.map(p=>p[0].toFixed(1)+' '+p[1].toFixed(1)).join('L'));
      return;
    }
    setRect(draw.el,normRect(draw.s,ptOf(e,draw.rect)));
  });
  const fin=(e,cancel)=>{
    if(!draw)return;
    const d=draw;draw=null;d.el.remove();
    if(cancel)return;
    if(d.arrow){d.e=arrowEnd(d,e);finishArrow(d);return;}
    if(d.free){finishFree(d);return;}
    const n=normRect(d.s,ptOf(e,d.rect));
    if(n.w>MIN*1.2&&n.h>MIN*1.2)addRegion(n);else selectRegion(null);
  };
  ov.addEventListener('pointerup',e=>fin(e,false));ov.addEventListener('pointercancel',e=>fin(e,true));
}
function nextNum(){const n=cur.regions.map(r=>parseInt(r.num,10)).filter(x=>!isNaN(x));return String((n.length?Math.max(...n):0)+1);}
function newRegion(rect,extra={}){
  return Object.assign({id:uid(),x:rect.x,y:rect.y,w:rect.w,h:rect.h,num:nextNum(),label:'',feed:'',type:cur.types[0],concept:'Both',notes:'',t0:'',t1:'',rot:0,
    fields:(cur.fieldNames||[]).map(k=>({k,v:''}))},extra);
}
function addRegion(rect,extra){
  const r=newRegion(rect,extra);cur.regions.push(r);selId=r.id;
  checkpoint();renderRegions();renderPanel();

function pasteRegion(inPlace){

function nudge(dx,dy){

function syncPx(r){
  const p=pxOf(r);
  $$('#selection [data-px]').forEach(i=>{if(i!==document.activeElement)i.value=p[i.dataset.px];});
  const rt=$('#selection [data-rot]');
  if(rt&&rt!==document.activeElement)rt.value=r.kind==='arrow'?arrowMetrics(r,cur).ang:(r.rot||0);
  const ro=$('#selection .ratioOut');if(ro)ro.textContent=ratioStr(p.w,p.h);
}
function applyPx(r,k,val){
  const v=parseFloat(val);if(!isFinite(v))return;
  const cw=cur.canvas.w,ch=cur.canvas.h,ratio=(r.w*cw)/(r.h*ch);
  if(k==='x')r.x=clamp(v/cw*100,0,100-r.w);
  else if(k==='y')r.y=clamp(v/ch*100,0,100-r.h);
  else if(k==='w'){r.w=clamp(v/cw*100,MIN,100-r.x);if(prefs.lock)r.h=clamp(r.w*cw/ratio/ch,MIN,100-r.y);}
  else if(k==='h'){r.h=clamp(v/ch*100,MIN,100-r.y);if(prefs.lock)r.w=clamp(r.h*ch*ratio/cw,MIN,100-r.x);}
  const el=$(`.region[data-id="${r.id}"]`);if(el)setRect(el,r);
  syncPx(r);
}
function afterRot(r){const el=$(`.region[data-id="${r.id}"]`);if(el)setRect(el,r);syncPx(r);checkpoint();}

let vT=null;
function propagateVideo(){
  const src=cur;clearTimeout(vT);
  vT=setTimeout(()=>{
    scenesOf(src.vid).forEach(b=>{if(b!==src){b.vname=src.vname;b.vurl=src.vurl;b.updated=Date.now();dbPut(b).catch(()=>{});}});
  },500);
}

$('#panel').addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='boardName'){cur.name=t.value;save();const o=$(`#bar [data-bar="board"] option[value="${cur.id}"]`);if(o)o.textContent=dispName(cur);if(cur.vid)renderStrip();return;}
  if(t.id==='listFilter'){listFilter=t.value;renderList();return;}
  if(t.dataset.vf&&cur.vid){
    const k=t.dataset.vf;
    if(k==='t'){const v=parseT(t.value);if(v==='')return;cur.t=v;save();renderStrip();}
    else{cur[k]=k==='vurl'?t.value.trim():t.value;save();propagateVideo();renderStrip();}
    const o=$(`#bar [data-bar="board"] option[value="${cur.id}"]`);if(o)o.textContent=dispName(cur);
    return;
  }
  const sel=getSel();if(!sel||view!=='editor')return;
  const d=t.dataset;
  if(d.f){sel[d.f]=t.value;refreshRegionEl(sel);renderList();checkpoint('f:'+sel.id+d.f);}
  else if(d.ar){
    if(d.ar==='dash')sel.dash=t.checked;
    else if(d.ar==='curve')sel.curve=parseFloat(t.value)||0;
    else if(d.ar==='target')sel.target=t.value;
    const el=$(`.region[data-id="${sel.id}"]`);if(el)setRect(el,sel);
    checkpoint('ar:'+sel.id+d.ar);
  }
  else if(d.rot!==undefined){
    const v=parseFloat(t.value);if(!isFinite(v))return;
    if(sel.kind==='arrow')rotArrow(sel,v-arrowMetrics(sel,cur).ang,cur);
    else sel.rot=+normDeg(v).toFixed(1);
    const el=$(`.region[data-id="${sel.id}"]`);if(el)setRect(el,sel);
    syncPx(sel);checkpoint('rot:'+sel.id);
  }
  else if(d.tm){sel[d.tm]=parseT(t.value);checkpoint('tm:'+sel.id+d.tm);}
  else if(d.px){applyPx(sel,d.px,t.value);checkpoint('px:'+sel.id);}
  else if(d.fk!==undefined){sel.fields[+d.fk].k=t.value;checkpoint('fk:'+sel.id+d.fk);}
  else if(d.fv!==undefined){sel.fields[+d.fv].v=t.value;checkpoint('fv:'+sel.id+d.fv);}
});
$('#panel').addEventListener('change',e=>{
  const t=e.target;
  if(t.hasAttribute('data-lock')){prefs.lock=t.checked;savePrefs();return;}
  if(t.dataset.ratio!==undefined&&t.value){
    const r=getSel();if(!r)return;
    const [a,b]=t.value.split(':').map(Number),cw=cur.canvas.w,ch=cur.canvas.h;
    let wpx=r.w*cw/100,hpx=wpx*b/a;const maxH=(100-r.y)/100*ch;
    if(hpx>maxH){hpx=maxH;wpx=hpx*a/b;}
    r.w=wpx/cw*100;r.h=hpx/ch*100;
    const el=$(`.region[data-id="${r.id}"]`);if(el)setRect(el,r);
    syncPx(r);checkpoint();t.value='';
  }
});
$('#panel').addEventListener('click',e=>{
  const cp=e.target.closest('[data-copy]');
  if(cp){copyText(cp.dataset.copy).then(()=>toast('Copied: '+cp.dataset.copy));return;}
  const a=e.target.closest('[data-act]');
  if(a){panelAct(a);return;}
  const g=e.target.closest('.grp');
  if(g&&view==='compare'){cmpSel=cmpSel===g.dataset.key?null:g.dataset.key;updateSelectionClasses();renderPanel();return;}
  const li=e.target.closest('.list-item');
  if(li&&view==='editor')selectRegion(li.dataset.id);
});
function panelAct(a){
  const act=a.dataset.act,sel=getSel();
  if(act==='upload')pickFiles(false,f=>loadImageFile(f[0]));
  else if(act==='suggest')suggestElements(a);
  else if(act==='delBoard')deleteBoard(cur);
  else if(act==='delRegion'&&sel)removeRegion(sel.id);
  else if(act==='dupRegion'&&sel){clip=JSON.parse(JSON.stringify(sel));pasteRegion();}
  else if(act==='addField'&&sel){sel.fields.push({k:'',v:''});checkpoint();renderPanel();const i=$$('#selection [data-fk]');if(i.length)i[i.length-1].focus();}
  else if(act==='rmField'&&sel){sel.fields.splice(+a.dataset.i,1);checkpoint();renderPanel();}
  else if(act==='renumber'){cur.regions.forEach((r,i)=>r.num=String(i+1));checkpoint();renderRegions();renderPanel();}
  else if(act==='sortNum'){cur.regions.sort((x,y)=>(parseFloat(x.num)||1e9)-(parseFloat(y.num)||1e9));checkpoint();renderPanel();}
  else if(act==='bulk')bulkModal();
  else if(act==='toRect'&&sel){delete sel.pts;checkpoint();renderRegions();renderPanel();}
  else if(act==='flipArrow'&&sel&&sel.kind==='arrow'){
    const p=sel.ap;sel.ap=[p[2],p[3],p[0],p[1]];sel.curve=-(sel.curve||0);
    afterRot(sel);renderPanel();
  }
  else if(act==='rot90'&&sel){rotateBy(sel,90);afterRot(sel);}
  else if(act==='rot0'&&sel){
    if(sel.kind==='arrow')rotArrow(sel,-arrowMetrics(sel,cur).ang,cur);else sel.rot=0;
    afterRot(sel);
  }
}
function copyText(t){
  if(navigator.clipboard&&window.isSecureContext)return navigator.clipboard.writeText(t);
  return new Promise(res=>{const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');}catch(e){}ta.remove();res();});
}

/* =========================================================
   LIBRARY (multiple templates, videos grouped)
   ========================================================= */
function libEntries(){
  const q=libSearch.trim().toLowerCase();
  const match=b=>!q||[b.name,b.vname].join(' ').toLowerCase().includes(q)||b.regions.some(r=>[r.label,r.feed,r.concept].join(' ').toLowerCase().includes(q));
  const out=[],seen=new Map();
  boards.forEach(b=>{
    if(b.vid){
      if(libKind==='static')return;
      let g=seen.get(b.vid);
      if(!g){g={video:true,vid:b.vid,scenes:[],hit:false};seen.set(b.vid,g);out.push(g);}
      g.scenes.push(b);if(match(b))g.hit=true;
    }else if(libKind!=='video'&&match(b))out.push({video:false,b});
  });
  const res=out.filter(e=>!e.video||e.hit);
  res.forEach(e=>{if(e.video)e.scenes.sort((a,b)=>(a.t||0)-(b.t||0));});
  const name=e=>e.video?(e.scenes[0].vname||'Video'):(e.b.name||'');
  const upd=e=>e.video?Math.max(...e.scenes.map(s=>s.updated||0)):(e.b.updated||0);
  const cnt=e=>e.video?e.scenes.reduce((n,s)=>n+s.regions.length,0):e.b.regions.length;
  const f=libSort==='updated'?(a,b)=>upd(b)-upd(a):libSort==='elements'?(a,b)=>cnt(b)-cnt(a):(a,b)=>name(a).localeCompare(name(b));
  return res.sort(f);
}
function renderLibrary(){
  const st=$('#stage');st.className='lib';st.dataset.key='lib';
  const list=libEntries();
  st.innerHTML=`<div class="grid">${list.map(cardHTML).join('')}<div class="card add" data-act="newBoard">+ New template<br><small style="font-weight:400">or drop images here</small></div></div>`
    +(libSearch.trim()&&!list.length?'<div class="empty-lib">No templates match your search.</div>':'');
}

  const b=e.b;
  return `<div class="card${picked.has(b.id)?' picked':''}${b.id===cur.id?' current':''}" data-id="${b.id}">

$('#stage').addEventListener('click',e=>{

    }
    if(e.target.closest('.pick'))return;

const cmpBoards=()=>cmpIds.map(id=>boards.find(b=>b.id===id)).filter(Boolean);
function keyOf(r){
  if(cmpBy==='num')return '#'+String(r.num||'').trim();
  const l=(r.label||'').trim().toLowerCase();return l||('#'+String(r.num||'').trim());
}
const normFeed=r=>splitFeed(r.feed).map(s=>s.toLowerCase()).sort().join(',');
function cmpGroups(){
  const bs=cmpBoards(),map=new Map();
  bs.forEach(b=>b.regions.forEach(r=>{
    const k=keyOf(r);
    if(!map.has(k))map.set(k,{key:k,label:r.label||('#'+r.num),items:new Map()});
    const g=map.get(k);if(!g.items.has(b.id))g.items.set(b.id,[]);g.items.get(b.id).push(r);
  }));
  return [...map.values()].map(g=>{
    g.per=bs.map(b=>g.items.get(b.id)||null);
    g.missing=g.per.filter(x=>!x).length;
    g.differs=new Set(g.per.filter(Boolean).map(rs=>rs.map(normFeed).join('|'))).size>1;
    return g;
  });
}
function renderCompare(){
  const st=$('#stage');st.className='cmp';st.dataset.key='cmp';st.innerHTML='';
  const bs=cmpBoards();
  if(!bs.length){st.innerHTML='<div class="empty-lib" style="margin:auto">Pick templates in the Library, then press Compare.</div>';return;}
  bs.forEach(b=>{
    const col=document.createElement('div');col.className='col';col.style.width=prefs.colW+'px';
    col.innerHTML=`<div class="col-head"><div style="min-width:0"><b>${esc(dispName(b))}</b><span>${b.canvas.w}×${b.canvas.h} · ${b.regions.length} elements</span></div><button class="btn sm" data-act="openCol" data-id="${b.id}">Open</button></div>`;
    const cv=document.createElement('div');cv.className='canvas'+(prefs.labels?' labels':'');
    if(b.image){const img=new Image();img.src=urlOf(b);img.alt='';img.draggable=false;cv.appendChild(img);}
    else{const n=document.createElement('div');n.className='noimg';n.textContent='No image';cv.appendChild(n);}
    const ov=document.createElement('div');ov.className='overlay';
    ov.addEventListener('click',e=>{if(e.target===ov){cmpSel=null;updateSelectionClasses();renderPanel();}});
    [...b.regions].sort((x,y)=>y.w*y.h-x.w*x.h).forEach(r=>ov.appendChild(regionEl(r,b,{compare:true})));
    cv.appendChild(ov);col.appendChild(cv);st.appendChild(col);
  });
  updateSelectionClasses();
}
function renderComparePanel(p){
  const bs=cmpBoards();
  if(bs.length<2){p.innerHTML='<div class="panel-sec"><div class="empty-sel">Add at least two templates to compare them.</div></div>';return;}
  const all=cmpGroups(),diffs=all.filter(g=>g.differs||g.missing).length;
  const gs=cmpDiff?all.filter(g=>g.differs||g.missing):all;
  p.innerHTML=`<div class="panel-top"><h2 class="board-name-view">Comparing ${bs.length} templates</h2>
    <div class="board-meta">${all.length} element groups · ${diffs} with differences</div>

    <div class="panel-sec">${gs.map(grpHTML).join('')||'<div class="empty-sel">No differences found.</div>'}</div>`;

function grpHTML(g){
  const bs=cmpBoards(),on=cmpSel===g.key;
  let h=`<div class="grp${on?' is-selected':''}" data-key="${esc(g.key)}"><div class="grp-h"><b>${esc(g.label)}</b>
    ${g.differs?'<span class="flag warn">feed differs</span>':''}${g.missing?`<span class="flag warn">missing in ${g.missing}</span>`:''}</div>`;
  bs.forEach((b,i)=>{
    const rs=g.per[i];
    h+=`<div class="grp-row"><span class="bn" title="${esc(dispName(b))}">${esc(dispName(b))}</span><span class="bf${rs?'':' none'}">${rs?esc(rs.map(r=>r.feed||'—').join(' · ')):'not present'}</span></div>`;
  });
  if(on)h+=bs.map((b,i)=>{const rs=g.per[i];if(!rs)return '';
    return rs.map(r=>{const p=pxOf(r,b);return `<div class="xtra"><b>${esc(dispName(b))}</b> · ${kindIcon(r)}${esc(r.type)}${r.concept?' · '+esc(r.concept):''} · ${p.w}×${p.h} px (${ratioStr(p.w,p.h)})${r.rot?' · '+r.rot+'°':''}${b.vid?' · ⏱ '+esc(timingStr(r)):''}
      ${(r.fields||[]).filter(f=>f.k||f.v).map(f=>`<br>${esc(f.k)}${f.req?' (required)':''}: ${esc(f.v)}`).join('')}${r.notes?`<br><i>${esc(r.notes)}</i>`:''}</div>`;}).join('');}).join('');

function downloadBlob(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500);}
async function serializeBoard(b){const o=clean(b);o.image=b.image?await blobToDataURL(b.image):null;return o;}
const shapeName=r=>r.kind==='arrow'?'Arrow':(Array.isArray(r.pts)&&r.pts.length>=3?'Freehand':'Rectangle');
function tableRows(b){
  const v=!!b.vid;
  const head=['#','Label','Type','Feed columns','Concept','Shape',...(v?['Scene time','Appears','Disappears']:[]),'X (px)','Y (px)','Width (px)','Height (px)','Ratio','Rotation / angle (°)','Extra fields','Notes'];
  return [head,...b.regions.map(r=>{const p=pxOf(r,b);return [r.num,r.label,r.type,r.feed,r.concept,shapeName(r),...(v?[fmtT(b.t||0),fmtT(r.t0),fmtT(r.t1)]:[]),p.x,p.y,p.w,p.h,ratioStr(p.w,p.h),
    r.kind==='arrow'?arrowMetrics(r,b).ang:(r.rot||0),
    (r.fields||[]).filter(f=>f.k||f.v).map(f=>f.k+(f.req?' (required)':'')+': '+f.v).join('; '),(r.notes||'').replace(/\n/g,' ')];})];
}
const csvCell=v=>{const s=String(v??'');return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;};
const exportName=()=>cur.vid?`${cur.vname||'video'}-${fmtT(cur.t||0).replace(':','m')}`:cur.name;
function drawArrowCanvas(x,r,col,W,H,ox,oy){
  const g=arrowGeom(r,W,H);if(!g)return;
  const sw=g.sw,P=new Path2D(g.d),head=new Path2D();
  head.moveTo(g.head[0][0],g.head[0][1]);head.lineTo(g.head[1][0],g.head[1][1]);head.lineTo(g.head[2][0],g.head[2][1]);head.closePath();
  x.save();x.translate(ox,oy);x.lineCap='round';x.lineJoin='round';x.setLineDash([]);
  x.strokeStyle='rgba(255,255,255,.9)';x.fillStyle='#fff';
  x.lineWidth=sw*2.4;x.stroke(P);x.lineWidth=sw*1.4;x.stroke(head);x.fill(head);
  x.strokeStyle=col;x.fillStyle=col;x.lineWidth=sw;
  x.setLineDash(r.dash?[sw*3,sw*2.2]:[]);x.stroke(P);x.setLineDash([]);x.fill(head);
  x.restore();
}
const exporters={
  async all(){
    const list=[];for(const b of boards)list.push(await serializeBoard(b));
    downloadBlob(new Blob([JSON.stringify({format:'template-reference-explorer',version:3,exported:new Date().toISOString(),boards:list})],{type:'application/json'}),`template-references-${new Date().toISOString().slice(0,10)}.json`);
    toast('Exported all templates');
  },
  async one(){
    const list=[];for(const b of (cur.vid?scenesOf(cur.vid):[cur]))list.push(await serializeBoard(b));
    downloadBlob(new Blob([JSON.stringify({format:'template-reference-explorer',version:3,boards:list})],{type:'application/json'}),`${slug(cur.vid?cur.vname:cur.name)}.json`);
    toast('Exported');
  },
  vcsv(){
    const rows=[];
    scenesOf(cur.vid).forEach((b,i)=>{const t=tableRows(b);if(!i)rows.push(['Scene',...t[0]]);t.slice(1).forEach(r=>rows.push([b.name||'Scene',...r]));});
    downloadBlob(new Blob(['\ufeff'+rows.map(r=>r.map(csvCell).join(',')).join('\n')],{type:'text/csv'}),`${slug(cur.vname)}-all-scenes.csv`);toast('CSV exported');
  },
  csv(){downloadBlob(new Blob(['\ufeff'+tableRows(cur).map(r=>r.map(csvCell).join(',')).join('\n')],{type:'text/csv'}),`${slug(exportName())}-reference.csv`);toast('CSV exported');},
  tsv(){copyText(tableRows(cur).map(r=>r.join('\t')).join('\n')).then(()=>toast('Table copied. Paste it into a sheet'));},
  async png(){
    if(!cur.image)return toast('This template has no image');
    const img=await loadImg(urlOf(cur)),c=document.createElement('canvas');c.width=img.naturalWidth;c.height=img.naturalHeight;
    const x=c.getContext('2d');x.drawImage(img,0,0);
    const s=Math.max(1,c.width/900);x.textAlign='center';x.textBaseline='middle';x.font=`700 ${12*s}px sans-serif`;
    cur.regions.forEach(r=>{
      const col=regColor(cur,r),rx=r.x/100*c.width,ry=r.y/100*c.height,rw=r.w/100*c.width,rh=r.h/100*c.height;
      const mx=rx+rw/2,my=ry+rh/2,th=(r.rot||0)*Math.PI/180;
      x.save();x.translate(mx,my);x.rotate(th);x.translate(-mx,-my);
      x.lineWidth=2*s;x.strokeStyle=col;x.fillStyle=col+'26';
      if(r.kind==='arrow')drawArrowCanvas(x,r,col,c.width,c.height,rx,ry);
      else if(r.pts&&r.pts.length>=3){const pth=new Path2D(ptsPath(r.pts,rw/100,rh/100,rx,ry));x.fill(pth);x.stroke(pth);}
      else{x.fillRect(rx,ry,rw,rh);x.strokeRect(rx,ry,rw,rh);}
      x.restore();
      const ca=Math.cos(th),sa=Math.sin(th),ox=-rw/2,oy=-rh/2,bx=mx+ox*ca-oy*sa,by=my+ox*sa+oy*ca;
      x.beginPath();x.arc(bx,by,11*s,0,Math.PI*2);x.fillStyle=col;x.fill();x.strokeStyle='#fff';x.lineWidth=2*s;x.stroke();
      x.fillStyle='#fff';x.fillText(String(r.num||''),bx,by+.5*s);
    });
    c.toBlob(bl=>downloadBlob(bl,`${slug(exportName())}-annotated.png`),'image/png');
  }
};
async function importFile(file){
  try{
    const data=JSON.parse(await file.text()),list=Array.isArray(data)?data:data.boards;
    if(!Array.isArray(list))throw new Error('bad format');
    flushSave();
    const clash=list.some(b=>b.id&&boards.some(x=>x.id===b.id));
    const overwrite=clash?confirm('Some imported templates already exist.\n\nOK = overwrite them\nCancel = import as copies'):false;
    const vmap={};
    for(const b of list){
      if(!b.id||(clash&&!overwrite&&boards.some(x=>x.id===b.id))){
        b.id=uid();
        if(clash){
          b.name=(b.name||'Untitled')+(b.vid?'':' (imported)');
          if(b.vid){vmap[b.vid]=vmap[b.vid]||uid();b.vid=vmap[b.vid];b.vname=(b.vname||'Video')+' (imported)';}
        }
      }
      await migrate(b);markImgDirty(b.id);await dbPut(b);
    }
    boards=await dbGetAll();sortBoards();
    cur=boards.find(b=>b.id===cur.id)||boards[0];
    resetHistory();imgVersion++;selId=null;render(true);
    toast(`Imported ${list.length} template${list.length===1?'':'s'}`);
  }catch(e){toast('Could not read that file');}
}

    const p=await processImage(file);applyImage(cur,p);imgVersion++;zoom='fit';
    if(!cur.regions.length)mode='edit';

async function createFromFiles(files){
  const list=[...files].filter(f=>f.type.startsWith('image/'));
  if(!list.length)return toast('No images found');
  toast(`Importing ${list.length} image${list.length===1?'':'s'}…`);
  let last=null,n=0;
  for(const f of list){
    try{
      const p=await processImage(f),b=newBoard(f.name.replace(/\.[^.]+$/,'')||'Untitled');
      applyImage(b,p);boards.push(b);await dbPut(b);last=b;n++;

async function deleteVideo(vid){
  const sc=scenesOf(vid);
  if(!confirm(`Delete the video "${(sc[0]&&sc[0].vname)||'Video'}" and its ${sc.length} scene${sc.length===1?'':'s'}? This cannot be undone.`))return;
  for(const b of sc){
