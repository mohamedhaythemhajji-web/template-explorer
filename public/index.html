   ========================================================= */
async function suggestElements(btn){
  if(!cur.image)return;
  if(!cfg.key()){settingsModal(()=>{const b=$('[data-act="suggest"]');if(b)suggestElements(b);});return;}
  const label=btn.textContent;btn.disabled=true;btn.textContent='Analyzing…';
  try{
    const img=await loadImg(urlOf(cur)),k=Math.min(1,1568/Math.max(img.naturalWidth,img.naturalHeight));
    const w=Math.round(img.naturalWidth*k),h=Math.round(img.naturalHeight*k);
    const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);
    const b64=c.toDataURL('image/jpeg',.85).split(',')[1];
    const types=cur.types.join(' | ');
    const prompt=`This is an ad creative (${w}x${h} pixels). Identify the distinct elements a template would populate or control: headline, subheadline, product image(s), offer text, ribbon or banner, promo code, end date, logo, seal or badge, CTA button, disclaimer, and the background.
Return ONLY a JSON array, no prose. Each item: {"label": string, "type": one of [${types}], "x": number, "y": number, "w": number, "h": number}
x,y is the top-left corner and w,h the size, all in pixels of the ${w}x${h} image. Use a style/controller-like type for background or ribbon colour.`;
    const resp=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',
      headers:{'content-type':'application/json','x-api-key':cfg.key(),'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:cfg.model(),max_tokens:2000,messages:[{role:'user',content:[
        {type:'image',source:{type:'base64',media_type:'image/jpeg',data:b64}},{type:'text',text:prompt}]}]})});
    const data=await resp.json();
    if(!resp.ok)throw new Error(data.error?.message||('HTTP '+resp.status));
    const text=(data.content||[]).map(x=>x.text||'').join(''),a=text.indexOf('['),z=text.lastIndexOf(']');
    if(a<0||z<0)throw new Error('No boxes returned');
    const items=JSON.parse(text.slice(a,z+1));let added=0;
    for(const it of items){
      const x=+it.x,y=+it.y,bw=+it.w,bh=+it.h;if(![x,y,bw,bh].every(Number.isFinite))continue;
      const rect={x:clamp(x/w*100,0,100),y:clamp(y/h*100,0,100),w:clamp(bw/w*100,MIN,100),h:clamp(bh/h*100,MIN,100)};
      rect.w=Math.min(rect.w,100-rect.x);rect.h=Math.min(rect.h,100-rect.y);
      const type=cur.types.find(t=>t.toLowerCase()===String(it.type||'').toLowerCase())||cur.types[0];
      cur.regions.push(newRegion(rect,{label:String(it.label||''),type}));added++;
    }
    selId=null;checkpoint();renderRegions();renderPanel();
    toast(added?`Added ${added} suggested boxes. Adjust them, then add feed columns. Ctrl+Z undoes`:'No usable boxes returned');
  }catch(err){toast('AI suggest failed: '+err.message);}
  finally{const bb=$('[data-act="suggest"]');if(bb){bb.disabled=false;bb.textContent=label;}}
}

document.addEventListener('keydown',e=>{
  if($('#modalRoot').firstChild){if(e.key==='Escape')closeModal();return;}
  const tag=document.activeElement&&document.activeElement.tagName,typing=['INPUT','TEXTAREA','SELECT'].includes(tag);
  const mod=e.ctrlKey||e.metaKey,k=e.key.toLowerCase();
  if(typing)return;
  if(mod&&k==='z'){e.preventDefault();e.shiftKey?redo():undo();return;}
  if(mod&&k==='y'){e.preventDefault();redo();return;}
  if(view==='compare'){if(e.key==='Escape'){cmpSel=null;updateSelectionClasses();renderPanel();}return;}
  if(view!=='editor')return;
  const sel=getSel();
  if(e.key==='Escape'){selectRegion(null);return;}
  if(!mod&&cur.vid&&(e.key==='['||e.key===']')){
    const sc=scenesOf(cur.vid),n=sc[sc.indexOf(cur)+(e.key===']'?1:-1)];
    if(n)switchScene(n);
    return;
  }
  if(!mod&&mode==='edit'&&(k==='r'||k==='f'||k==='a')){
    tool=k==='f'?'free':k==='a'?'arrow':'rect';prefs.tool=tool;savePrefs();renderBar();
    toast(tool==='free'?'Freehand drawing':tool==='arrow'?'Arrow: drag on the image to draw one':'Rectangle drawing');return;
  }
  if(!mod&&k==='e'){mode='edit';selId=null;render(true);return;}
  if(!mod&&k==='v'){mode='view';selId=null;render(true);return;}
  if(!mod&&(e.key==='+'||e.key==='='))setZoom(effZoom()*1.2);
  if(!mod&&(e.key==='-'||e.key==='_'))setZoom(effZoom()/1.2);
  if(!mod&&e.key==='0'){zoom='fit';applyZoom();}
  if(!mod&&e.key==='1')setZoom(1);
  if(mode==='view'&&(e.key==='ArrowDown'||e.key==='ArrowUp')&&cur.regions.length){
    e.preventDefault();
    const i=cur.regions.findIndex(r=>r.id===selId),n=cur.regions.length;
    selectRegion(cur.regions[e.key==='ArrowDown'?(i+1)%n:(i<=0?n-1:i-1)].id);return;
  }
  if(mode!=='edit'||!sel)return;
  if(e.key==='Delete'||e.key==='Backspace'){e.preventDefault();removeRegion(sel.id);}
  else if(e.key.startsWith('Arrow')){
    e.preventDefault();const st=e.shiftKey?10:1;
    nudge(e.key==='ArrowLeft'?-st:e.key==='ArrowRight'?st:0,e.key==='ArrowUp'?-st:e.key==='ArrowDown'?st:0);
  }
  else if(mod&&k==='d'){e.preventDefault();clip=JSON.parse(JSON.stringify(sel));pasteRegion();}
  else if(mod&&k==='c'){clip=JSON.parse(JSON.stringify(sel));toast('Element copied');}
});

/* ===== per-element colours ===== */
const regColor=(b,r)=>r.color||typeColor(b,r.type);
const hex2rgb=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const rgb2hex=a=>'#'+a.map(v=>Math.round(clamp(v,0,255)).toString(16).padStart(2,'0')).join('');
const lum=a=>{const c=a.map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4);});return .2126*c[0]+.7152*c[1]+.0722*c[2];};
function readable(hex){let a=hex2rgb(hex),f=1;while(lum(a.map(v=>v*f))>.28&&f>.15)f-=.03;return rgb2hex(a.map(v=>v*f));}
function hsl2hex(h,s,l){s/=100;l/=100;const k=n=>(n+h/30)%12,a=s*Math.min(l,1-l),f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));return rgb2hex([f(0),f(8),f(4)].map(v=>v*255));}
const COLORS=(()=>{
  const hues=[0,25,45,70,100,150,180,205,225,260,290,330],rows=[];
  [58,48,38,28].forEach(l=>rows.push(hues.map(h=>hsl2hex(h,70,l))));
  rows.push(Array.from({length:12},(_,i)=>hsl2hex(215,14,10+i*4)));
  return rows.flat().map(readable);
})();

async function grabFrame(v){
  const vw=v.videoWidth,vh=v.videoHeight;
  if(!vw||!vh)throw new Error('Load a video first');
  const k=Math.min(1,1600/Math.max(vw,vh)),c=document.createElement('canvas');
  c.width=Math.round(vw*k);c.height=Math.round(vh*k);
  c.getContext('2d').drawImage(v,0,0,c.width,c.height);
  let blob;
  try{blob=await new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error('encode')),'image/jpeg',.9));}
  catch(e){throw new Error('Could not read the frame. If you used a link, load the file from your computer instead.');}
  const p=await processImage(blob);
  p.ow=vw;p.oh=vh; // canvas size = real video resolution
  return p;
}

async function addScene(base,p,t,copyBoxes){
  let target;
  if(!base.image){target=base;}
  else{
    target=newBoard('Scene '+(scenesOf(base.vid).length+1));
    Object.assign(target,{vid:base.vid,vname:base.vname,vurl:base.vurl,types:[...base.types],fieldNames:[...(base.fieldNames||[])],canvasAuto:base.canvasAuto});
    if(base.canvasAuto===false)target.canvas={...base.canvas};
    if(copyBoxes)target.regions=JSON.parse(JSON.stringify(base.regions)).map(r=>({...r,id:uid()}));
    boards.push(target);
  }
  target.t=t;
  applyImage(target,p);
  await dbPut(target);
  sortBoards();
  if(target===cur){imgVersion++;zoom='fit';render(true);}
  else renderStrip();
}

function captureModal(){
  if(!cur||!cur.vid)return;
  const base=cur;
  let objUrl=null,busy=false,count=0,closed=false;
  const m=openModal({title:'Capture frames',wide:true,
    body:`<p class="mhint">Choose the video from your computer (it only plays here and is never uploaded). Scrub to a moment and capture it as a scene. Only the frames are saved.</p>
    <div class="row" style="margin-bottom:10px;align-items:center"><button class="btn sm" id="cpFile">Choose video file…</button>${base.vurl?'<button class="btn sm" id="cpLink">Use the video link</button>':''}<span class="mhint" id="cpName" style="margin:0"></span></div>
    <video id="cpVid" controls playsinline muted preload="auto" style="width:100%;max-height:42vh;background:#000;border-radius:8px"></video>
    <div class="cap-ctl"><button class="btn sm" data-cp2="-1">−1s</button><button class="btn sm" data-cp2="-0.1">−0.1s</button><span class="cap-time" id="cpTime">0:00</span><button class="btn sm" data-cp2="0.1">+0.1s</button><button class="btn sm" data-cp2="1">+1s</button><button class="btn sm primary" id="cpGrab" disabled>Capture this frame</button></div>
    <div class="cap-ctl"><label class="opt">Or capture every <input id="cpStep" type="number" min="0.5" step="0.5" value="2" style="width:64px"> s</label><button class="btn sm" id="cpAuto" disabled>Capture all</button><label class="opt"><input type="checkbox" id="cpCopy"> Copy boxes from the current scene</label></div>
    <div class="mhint" id="cpList">No frames captured yet.</div>`,
    actions:[{text:'Done',cls:'primary'}]});
  const v=$('#cpVid',m),grab=$('#cpGrab',m),auto=$('#cpAuto',m);
  const upd=()=>{$('#cpTime',m).textContent=fmtT(Math.round((v.currentTime||0)*10)/10);};
  ['timeupdate','seeked','loadedmetadata'].forEach(ev=>v.addEventListener(ev,upd));
  v.addEventListener('loadedmetadata',()=>{grab.disabled=auto.disabled=false;});
  v.addEventListener('error',()=>{grab.disabled=auto.disabled=true;toast('Could not load that video. Links need to allow cross-site access, so try the file instead');});
  $('#cpFile',m).onclick=()=>pickFiles(false,fs=>{
    if(objUrl)URL.revokeObjectURL(objUrl);
    objUrl=URL.createObjectURL(fs[0]);
    v.removeAttribute('crossorigin');v.src=objUrl;
    $('#cpName',m).textContent=fs[0].name;grab.disabled=auto.disabled=true;
  },'video/*');
  const lk=$('#cpLink',m);
  if(lk)lk.onclick=()=>{v.crossOrigin='anonymous';v.src=base.vurl;$('#cpName',m).textContent='Using the video link';grab.disabled=auto.disabled=true;};
  m.addEventListener('click',e=>{
    const s=e.target.closest('[data-cp2]');
    if(s&&v.duration){v.pause();v.currentTime=clamp(v.currentTime+parseFloat(s.dataset.cp2),0,v.duration);}
  });
  const seekTo=t=>new Promise(res=>{
    if(Math.abs(v.currentTime-t)<0.02)return res();
    let done=false;
    const f=()=>{if(done)return;done=true;v.removeEventListener('seeked',f);setTimeout(res,80);};
    v.addEventListener('seeked',f);setTimeout(f,4000);v.currentTime=t;
  });
  const shoot=async()=>{
    const t=Math.round(v.currentTime*10)/10;
    let p;
    try{p=await grabFrame(v);}catch(err){toast(err.message);return false;}
    await addScene(base,p,t,$('#cpCopy',m).checked);
    count++;
    $('#cpList',m).textContent=`${count} frame${count===1?'':'s'} captured. Latest at ${fmtT(t)}.`;
    return true;
  };
  grab.onclick=async()=>{
    if(busy)return;busy=true;grab.disabled=true;
    await shoot();
    grab.disabled=false;busy=false;
  };
  auto.onclick=async()=>{
    if(busy||!isFinite(v.duration))return;
    const step=Math.max(.5,parseFloat($('#cpStep',m).value)||2);
    const times=[];for(let t=0;t<v.duration-.05&&times.length<40;t+=step)times.push(t);
    if(times.length>12&&!confirm(`This will create ${times.length} scenes. Continue?`))return;
    busy=true;grab.disabled=auto.disabled=true;v.pause();
    for(const t of times){
      if(closed)break;
      await seekTo(t);
      if(!(await shoot()))break;
    }
    grab.disabled=auto.disabled=false;busy=false;
  };
  onModalClose=()=>{closed=true;try{v.pause();}catch(e){}if(objUrl)URL.revokeObjectURL(objUrl);renderStrip();};
}

/* =========================================================
   ROLES: viewer (read-only) vs editor
   ========================================================= */
let ROLE='edit';
const RO=()=>ROLE==='view';
const ROMSG=()=>toast('View-only. Use "Unlock editing" with the editor password.');

/* viewers never write or sync changes */
const _render=render;render=function(f){if(RO())mode='view';return _render(f);};

/* TRE-FOLDERS js: Library folders */
let libFolder='all';
let localFolders=[];
try{localFolders=JSON.parse(localStorage.getItem('tre_folders')||'[]');if(!Array.isArray(localFolders))localFolders=[];}catch(e){localFolders=[];}
const saveLocalFolders=()=>{try{localStorage.setItem('tre_folders',JSON.stringify(localFolders));}catch(e){}};
const fEsc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const sameF=(a,b)=>String(a||'').toLowerCase()===String(b||'').toLowerCase();

function flNames(){
  const m=new Map();
  boards.forEach(b=>{if(b.folder)m.set(b.folder.toLowerCase(),b.folder);});
  if(!RO())localFolders.forEach(n=>{if(!m.has(n.toLowerCase()))m.set(n.toLowerCase(),n);});
  return [...m.values()].sort((a,b)=>a.localeCompare(b));
}
function flItems(){
  const m=new Map();
  boards.forEach(b=>{
    const k=b.vid||b.id;let it=m.get(k);
    if(!it){it={key:k,folder:'',list:[]};m.set(k,it);}
    it.list.push(b);if(b.folder&&!it.folder)it.folder=b.folder;
  });
  return m;
}
const flOf=e=>e.video?((e.scenes.find(s=>s.folder)||{}).folder||''):(e.b.folder||'');

const _libEntries0=libEntries;
libEntries=function(){
  const res=_libEntries0();
  if(libFolder==='all')return res;
  return res.filter(e=>{const f=flOf(e);return libFolder==='none'?!f:sameF(f,libFolder.slice(2));});
};

async function flMove(key,folder){
  if(RO()){ROMSG();return;}
  const it=flItems().get(key);if(!it)return;
  if(typeof flushSave==='function')flushSave();
  folder=String(folder||'').trim().slice(0,80);
  for(const b of it.list){b.folder=folder;await dbPut(b);}
  render();
  toast(folder?('Moved to "'+folder+'"'):'Moved to Unfiled');
}
async function flNew(moveKey){
  if(RO()){ROMSG();return;}
  let n=prompt('New folder name:');if(n==null)return;
  n=n.trim().slice(0,80);if(!n)return;
  const ex=flNames().find(x=>sameF(x,n));
  if(ex){n=ex;toast('That folder already exists');}
  else{localFolders.push(n);saveLocalFolders();}
  if(moveKey)await flMove(moveKey,n);
  else{libFolder='f:'+n;render();}
}
async function flRename(old){
  if(RO()){ROMSG();return;}
  let n=prompt('Rename folder:',old);if(n==null)return;
  n=n.trim().slice(0,80);if(!n||n===old)return;
  if(flNames().some(x=>!sameF(x,old)&&sameF(x,n))){toast('A folder with that name already exists');return;}
  if(typeof flushSave==='function')flushSave();
  for(const b of boards.filter(b=>sameF(b.folder,old))){b.folder=n;await dbPut(b);}
  localFolders=localFolders.filter(x=>!sameF(x,old));localFolders.push(n);saveLocalFolders();
  if(libFolder==='f:'+old)libFolder='f:'+n;
  render();toast('Folder renamed');
}
async function flDelete(name){
  if(RO()){ROMSG();return;}
  const list=boards.filter(b=>sameF(b.folder,name));
  const n=new Set(list.map(b=>b.vid||b.id)).size;
  if(!confirm('Delete the folder "'+name+'"?\n'+(n?n+' template'+(n===1?'':'s')+' will move back to Unfiled. Nothing else is deleted.':'It is empty.')))return;
  if(typeof flushSave==='function')flushSave();
  for(const b of list){b.folder='';await dbPut(b);}
  localFolders=localFolders.filter(x=>!sameF(x,name));saveLocalFolders();
  if(libFolder==='f:'+name)libFolder='all';
  render();toast('Folder deleted');
}

function flBar(arr,names,ro){
  const none=arr.filter(i=>!i.folder).length;
  let h='<div class="fbar">';
  h+=`<span class="fchip${libFolder==='all'?' on':''}"><button data-fact="sel" data-f="all">All <small>${arr.length}</small></button></span>`;
  h+=`<span class="fchip${libFolder==='none'?' on':''}" data-fdrop="__none"><button data-fact="sel" data-f="none">Unfiled <small>${none}</small></button></span>`;
  names.forEach(n=>{
    const c=arr.filter(i=>sameF(i.folder,n)).length;
    h+=`<span class="fchip${libFolder==='f:'+n?' on':''}" data-fdrop="f:${fEsc(n)}"><button data-fact="sel" data-f="f:${fEsc(n)}">📁 ${fEsc(n)} <small>${c}</small></button>`
      +(ro?'':`<button class="fi" data-fact="ren" data-f="${fEsc(n)}" title="Rename folder">✎</button><button class="fi" data-fact="del" data-f="${fEsc(n)}" title="Delete folder">✕</button>`)
      +'</span>';
  });
  if(!ro)h+='<button class="btn sm" data-fact="new">+ New folder</button>';
  return h+'</div>';
}
function flDecorate(){
  const st=$('#stage');if(!st||view!=='library')return;
  const ro=RO(),names=flNames(),items=flItems(),arr=[...items.values()];
  if(names.length||!ro)st.insertAdjacentHTML('afterbegin',flBar(arr,names,ro));
  const opts='<option value="">📁 Move to…</option><option value="__none">Unfiled</option>'
    +names.map(n=>`<option value="f:${fEsc(n)}">${fEsc(n)}</option>`).join('')
    +'<option value="__new">＋ New folder…</option>';
  let any=false;
  st.querySelectorAll('.card[data-id],.card[data-vid]').forEach(card=>{
    any=true;
    const key=card.dataset.vid||card.dataset.id,it=items.get(key),f=it?it.folder:'';
    card.querySelectorAll('img').forEach(i=>{i.draggable=false;});
    const cb=card.querySelector('.cbody');
    if(f&&libFolder==='all'&&cb)cb.insertAdjacentHTML('beforeend','<div class="ftag">📁 '+fEsc(f)+'</div>');
    if(!ro){
      card.draggable=true;card.dataset.fkey=key;
      card.insertAdjacentHTML('beforeend','<div class="frow"><select class="fmove" title="Move to folder">'+opts+'</select></div>');
    }
  });
  if(!any&&libFolder!=='all'&&!libSearch.trim())
    st.insertAdjacentHTML('beforeend','<div class="fempty">This folder is empty.'+(ro?'':' Drag a template onto its chip above, or use “Move to…” on a template.')+'</div>');
}

/* drag and drop: card -> chip */
const flIsDrag=e=>e.dataTransfer&&Array.from(e.dataTransfer.types||[]).includes('text/tre-card');
const flClear=()=>document.querySelectorAll('.fchip.fover').forEach(c=>c.classList.remove('fover'));
document.addEventListener('dragstart',e=>{
  const card=e.target.closest&&e.target.closest('.card[data-fkey]');
  if(!card||RO())return;
  e.dataTransfer.setData('text/tre-card',card.dataset.fkey);
  e.dataTransfer.effectAllowed='move';
  card.classList.add('dragging');
});
document.addEventListener('dragend',()=>{flClear();document.querySelectorAll('.card.dragging').forEach(c=>c.classList.remove('dragging'));});
['dragenter','dragover','dragleave','drop'].forEach(t=>window.addEventListener(t,e=>{
  if(!flIsDrag(e))return;
  e.stopPropagation();
  const chip=e.target.closest&&e.target.closest('[data-fdrop]');
  if(t==='dragleave'){if(chip&&!chip.contains(e.relatedTarget))chip.classList.remove('fover');return;}
  flClear();
  if(chip&&!RO()){
    e.preventDefault();e.dataTransfer.dropEffect='move';
    if(t==='drop'){
      const key=e.dataTransfer.getData('text/tre-card'),v=chip.dataset.fdrop;
      flMove(key,v==='__none'?'':v.slice(2));
    }else chip.classList.add('fover');
  }
},true));

/* TRE-DETAILS js: template details + required/optional checker */
const DET_DEFAULT=['CREATIVE LAYOUT','Logo Position','COPY LAYOUT','AUDIO'];
const detClone=a=>JSON.parse(JSON.stringify(a));
const tdBlank=s=>!String(s==null?'':s).trim();
function effDetails(b){
  if(b&&Array.isArray(b.details))return b.details;
  return DET_DEFAULT.map(k=>({k:k,v:'',req:true}));
}
function tdIssues(list){
  const det=effDetails(list[0]);
  const dReq=det.filter(d=>d.req&&!tdBlank(d.k));
  const dMiss=dReq.filter(d=>tdBlank(d.v));
  const eMiss=[];let eReq=0;
  list.forEach(b=>(b.regions||[]).forEach(r=>(r.fields||[]).forEach(f=>{
    if(f.req&&!tdBlank(f.k)){eReq++;if(tdBlank(f.v))eMiss.push({b:b,r:r,f:f});}
  })));
  return {dReq:dReq.length,dMiss:dMiss,eReq:eReq,eMiss:eMiss,n:dMiss.length+eMiss.length};
}
const tdList=()=>cur.vid?scenesOf(cur.vid):[cur];

let detT=null;const detPend=new Set();
async function detFlush(){
  const l=[...detPend];detPend.clear();
  for(const b of l){try{await dbPut(b);}catch(e){console.error(e);}}
}
function setDet(mut){
  const arr=detClone(effDetails(cur));mut(arr);
  tdList().forEach(b=>{b.details=detClone(arr);b.updated=Date.now();detPend.add(b);});
  clearTimeout(detT);detT=setTimeout(detFlush,400);
}

function tdHTML(){

  let h='<div class="panel-sec tdet" id="tdet"><div class="sec-title"><span>Template details</span>'
    +(edit?'<span class="row"><button class="mini" data-tact="add">+ Add field</button></span>':'')+'</div>';
  if(edit){
    h+=list.map((d,i)=>'<div class="tdrow"><div class="tdl"><input data-dk="'+i+'" value="'+esc(d.k)+'" placeholder="Field name">'
      +'<button type="button" class="reqbtn'+(d.req?' on':'')+'" data-tact="req" data-i="'+i+'" title="Click to mark required or optional">'+(d.req?'Required':'Optional')+'</button>'
      +'<button type="button" class="tdmv" data-tact="up" data-i="'+i+'" title="Move up">▲</button>'
      +'<button type="button" class="tdmv" data-tact="down" data-i="'+i+'" title="Move down">▼</button>'
      +'<button type="button" class="x" data-tact="del" data-i="'+i+'" title="Remove field">✕</button></div>'
      +'<input class="tdv" data-dv="'+i+'" value="'+esc(d.v)+'" placeholder="Value (leave empty if not set yet)"></div>').join('');
    if(!list.length)h+='<div class="empty-sel">No fields yet. Use + Add field.</div>';

    h+=list.filter(d=>d.k||d.v).map(d=>'<div class="kv"><span>'+esc(d.k)
      +(d.k?(d.req?'<em class="reqtag">Required</em>':'<em class="opttag">Optional</em>'):'')+'</span><b'
      +(d.req&&tdBlank(d.v)?' class="miss"':'')+'>'+(tdBlank(d.v)?'—':esc(d.v))+'</b></div>').join('');
  }
  return h+'<div class="tchk" id="tchk"></div></div>';
}
function tdCheck(){
  const el=$('#tchk');if(!el)return;
  const list=tdList(),x=tdIssues(list),multi=list.length>1,bits=[];
  if(x.dReq)bits.push('Details: '+(x.dReq-x.dMiss.length)+' of '+x.dReq+' required filled');
  if(x.eReq)bits.push('Element fields: '+(x.eReq-x.eMiss.length)+' of '+x.eReq+' required filled');
  let h='<div class="tsum">'+(bits.length?bits.join(' · '):'No required fields set.')+'</div>';
  if(x.n){
    const items=x.dMiss.map(d=>'Template: '+esc(d.k)).concat(x.eMiss.map(m=>'#'+esc(m.r.num)+' '+esc(m.r.label||'')+' → '+esc(m.f.k)+(multi?' ('+esc(m.b.name||'scene')+')':'')));
    h+='<div class="tbad"><b>⚠ '+x.n+' required field'+(x.n===1?'':'s')+' empty</b><ul>'
      +items.slice(0,8).map(s=>'<li>'+s+'</li>').join('')+'</ul>'
      +(items.length>8?'<div>+ '+(items.length-8)+' more</div>':'')+'</div>';
  }else if(x.dReq||x.eReq)h+='<div class="tok">✓ All required fields are filled</div>';
  el.innerHTML=h;
}

/* TRE-COPY js: copy and paste elements across templates */
const CLIPKEY='tre_clip',CLIPALL='tre_clipall';
let clipAll=[];
try{const c=JSON.parse(localStorage.getItem(CLIPKEY)||'null');if(c&&!clip)clip=c;}catch(e){}
try{const a=JSON.parse(localStorage.getItem(CLIPALL)||'[]');if(Array.isArray(a))clipAll=a;}catch(e){}
const saveClip=()=>{try{localStorage.setItem(CLIPKEY,JSON.stringify(clip||null));}catch(e){}};
const saveClipAll=()=>{try{localStorage.setItem(CLIPALL,JSON.stringify(clipAll));}catch(e){}};
window.addEventListener('storage',e=>{
  try{
    if(e.key===CLIPKEY)clip=e.newValue?JSON.parse(e.newValue):null;
    if(e.key===CLIPALL){clipAll=JSON.parse(e.newValue||'[]');if(view==='editor')renderPanel();}
  }catch(err){}
});

const isTxt=el=>!!el&&(el.tagName==='TEXTAREA'||(el.tagName==='INPUT'&&!['checkbox','radio','button','range','file'].includes(el.type)));
const hasSelText=el=>{try{return el.selectionStart!==el.selectionEnd;}catch(e){return false;}};

/* same position when pasting onto a different template */
const _pasteRegion0=pasteRegion;
pasteRegion=function(inPlace){
  if(RO()){ROMSG();return;}
  if(!clip)return;
  const near=(a,b)=>Math.abs(a-b)<0.01;
  const onTop=cur.regions.some(r=>near(r.x,clip.x)&&near(r.y,clip.y)&&near(r.w,clip.w)&&near(r.h,clip.h));
  return _pasteRegion0.call(this,onTop?inPlace:true);
};

/* Cmd/Ctrl + C and V even when a dropdown or empty field has focus */
let pasteSeen=false;
document.addEventListener('paste',()=>{pasteSeen=true;},true);
document.addEventListener('keydown',e=>{
  if(!(e.ctrlKey||e.metaKey)||e.altKey||e.shiftKey)return;
  const k=e.key.toLowerCase();
  if(k!=='c'&&k!=='v')return;
  if(view!=='editor'||mode!=='edit'||$('#modalRoot').firstChild)return;
  const a=document.activeElement;
  if(k==='c'){
    if(isTxt(a)){if(hasSelText(a)||!getSel())return;a.blur();}
    else if(a&&a.tagName==='SELECT')a.blur();
    setTimeout(()=>{if(clip)saveClip();},0);
  }else{
    if(!clip||RO()||isTxt(a))return;
    if(a&&a.tagName==='SELECT')a.blur();
    pasteSeen=false;
    setTimeout(()=>{
      if(pasteSeen||!clip||view!=='editor'||mode!=='edit'||$('#modalRoot').firstChild)return;
      if(isTxt(document.activeElement))return;
      pasteRegion();
    },150);
  }
},true);

/* copy all / paste all */
function copyAllEls(){
  if(!cur.regions.length){toast('Nothing to copy on this template');return;}
  clipAll=JSON.parse(JSON.stringify(cur.regions));saveClipAll();
  toast('Copied '+clipAll.length+' element'+(clipAll.length===1?'':'s'));
  renderPanel();
}
function pasteAllEls(){
  if(RO()){ROMSG();return;}
  if(!clipAll.length){toast('Copy all elements first');return;}
  if(cur.regions.length&&!confirm('This template already has '+cur.regions.length+' element(s). Add the '+clipAll.length+' copied element(s) as well?'))return;
  const empty=!cur.regions.length;
  clipAll.forEach(src=>{
    const r=JSON.parse(JSON.stringify(src));r.id=uid();
    if(!empty)r.num=nextNum();
    cur.regions.push(r);
  });
  selId=null;checkpoint();renderRegions();renderPanel();
  toast('Pasted '+clipAll.length+' element'+(clipAll.length===1?'':'s'));
}
const _renderPanel2=renderPanel;
renderPanel=function(){
  _renderPanel2.apply(this,arguments);
  try{
    if(view!=='editor'||mode!=='edit'||RO())return;
    const l=$('#elList');if(!l)return;
    const sec=l.closest('.panel-sec'),t=sec&&sec.querySelector('.sec-title');
    if(!t)return;
    t.insertAdjacentHTML('afterend','<div class="row" style="margin:6px 0 10px"><button class="btn sm" data-cact="copyall">Copy all elements ('+cur.regions.length+')</button><button class="btn sm"'+(clipAll.length?'':' disabled')+' data-cact="pasteall">Paste all ('+clipAll.length+')</button></div>');
  }catch(err){console.error('copy',err);}
};
$('#panel').addEventListener('click',e=>{
  const b=e.target.closest&&e.target.closest('[data-cact]');if(!b)return;
  e.stopPropagation();
  if(b.dataset.cact==='copyall')copyAllEls();else pasteAllEls();
},true);

/* TRE-MULTI js: multi-select elements in the list */
const MKEY='tre_mclip';
const msel=new Set();let mAnchor=null;
const mTyping=()=>{const t=document.activeElement&&document.activeElement.tagName;return t==='INPUT'||t==='TEXTAREA';};
const mOK=()=>view==='editor'&&mode==='edit'&&!RO()&&!$('#modalRoot').firstChild;
const mCopyOf=a=>JSON.parse(JSON.stringify(a));
function readM(){try{const m=JSON.parse(localStorage.getItem(MKEY)||'null');return m&&Array.isArray(m.items)?m:null;}catch(e){return null;}}
function applyMsel(){document.querySelectorAll('.region[data-id]').forEach(el=>el.classList.toggle('msel',msel.has(el.dataset.id)));}
const mSelected=()=>cur.regions.filter(r=>msel.has(r.id));
function mRefresh(){renderList();applyMsel();}

const _renderList0=renderList;
renderList=function(){
  _renderList0.apply(this,arguments);
  try{
    const el=$('#elList');if(!el)return;
    const ids=new Set(cur.regions.map(r=>r.id));
    [...msel].forEach(i=>{if(!ids.has(i))msel.delete(i);});
    el.querySelectorAll('.list-item').forEach(li=>li.classList.toggle('multi',msel.has(li.dataset.id)));
    const old=$('#msbar');if(old)old.remove();
    if(mode==='edit'&&!RO()){
      if(msel.size)el.insertAdjacentHTML('beforebegin','<div class="msbar" id="msbar"><b>'+msel.size+' selected</b><button class="btn sm" data-mact="copy">Copy</button><button class="btn sm" data-mact="dup">Duplicate</button><button class="btn sm ghost danger" data-mact="del">Delete</button><button class="btn sm ghost" data-mact="clear">Clear</button></div>');
      else if(cur.regions.length>1)el.insertAdjacentHTML('beforebegin','<div class="mshint" id="msbar">Cmd/Ctrl-click to select several · Shift-click for a range · Cmd+A for all</div>');
    }
    applyMsel();
  }catch(err){console.error('multi',err);}
};
const _renderRegions0=renderRegions;
renderRegions=function(){
  const r=_renderRegions0.apply(this,arguments);
  try{applyMsel();}catch(e){}
  return r;
};
const _selectRegion0=selectRegion;
selectRegion=function(id){
  if(msel.size&&!(id&&msel.has(id)))msel.clear();
  return _selectRegion0.apply(this,arguments);
};

function mInsert(items,off,keep){
  const map={},added=[];
  items.forEach(src=>{
    const r=mCopyOf(src),old=r.id;r.id=uid();map[old]=r.id;
    r.x=clamp(r.x+off,0,100-r.w);r.y=clamp(r.y+off,0,100-r.h);
    if(!keep)r.num=nextNum();
    cur.regions.push(r);added.push(r);
  });
  added.forEach(r=>{if(r.target){const t=r.target;r.target=map[t]||(cur.regions.some(x=>x.id===t)?t:'');}});
  msel.clear();added.forEach(r=>msel.add(r.id));mAnchor=null;
  selId=null;checkpoint();renderRegions();renderPanel();
  return added.length;
}
function mCopy(){
  const list=mSelected();if(!list.length)return;
  const items=mCopyOf(list);
  try{
    if(items.length>1)localStorage.setItem(MKEY,JSON.stringify({items:items}));
    else localStorage.removeItem(MKEY);
  }catch(e){}
  clip=mCopyOf(items[0]);
  if(typeof saveClip==='function')saveClip();
  toast('Copied '+items.length+' element'+(items.length===1?'':'s')+' · Cmd+V on any template');
}
function mDup(){
  const list=mSelected();if(!list.length)return;
  const n=mInsert(list,2,false);
  toast('Duplicated '+n+' element'+(n===1?'':'s'));
}
function mDel(){
  const n=msel.size;if(!n)return;
  cur.regions=cur.regions.filter(r=>!msel.has(r.id));
  msel.clear();mAnchor=null;selId=null;checkpoint();renderRegions();renderPanel();
  toast(n+' element'+(n===1?'':'s')+' deleted · Cmd+Z to undo');
}
function mAction(a){
  if(!mOK()){if(RO())ROMSG();return;}
  if(a==='clear'){msel.clear();mRefresh();return;}
  if(!mSelected().length){mRefresh();return;}
  if(a==='copy')mCopy();else if(a==='dup')mDup();else if(a==='del')mDel();
}

/* paste: multiple elements when a multi-copy is stored */
const _pasteRegion4=pasteRegion;
pasteRegion=function(inPlace){
  const m=readM();
  if(m&&m.items.length>1){
    if(RO()){ROMSG();return;}
    const near=(a,b)=>Math.abs(a-b)<0.01;
    const onTop=m.items.some(s=>cur.regions.some(r=>near(r.x,s.x)&&near(r.y,s.y)&&near(r.w,s.w)&&near(r.h,s.h)));
    const n=mInsert(m.items,onTop?2:0,!cur.regions.length);
    toast('Pasted '+n+' elements');
    return;
  }
  return _pasteRegion4.apply(this,arguments);
};

/* clicks in the list and on the selection bar */
$('#panel').addEventListener('click',e=>{
  const t=e.target;if(!t.closest)return;
  if(t.closest('[data-act="dupRegion"]')){try{localStorage.removeItem(MKEY);}catch(x){}return;}
  const mb=t.closest('[data-mact]');
  if(mb){e.stopPropagation();mAction(mb.dataset.mact);return;}
  const li=t.closest('.list-item');
  if(!li||!mOK())return;
  const mod=e.metaKey||e.ctrlKey;
  if(!mod&&!e.shiftKey){if(msel.size){msel.clear();applyMsel();}return;}
  e.stopPropagation();e.preventDefault();
  const id=li.dataset.id;
  if(e.shiftKey){
    const ids=[...document.querySelectorAll('#elList .list-item')].map(x=>x.dataset.id);
    const anc=mAnchor||selId||id;
    let a=ids.indexOf(anc);const b=ids.indexOf(id);if(a<0)a=b;
    const lo=Math.min(a,b),hi=Math.max(a,b);
    if(!mod)msel.clear();
    ids.slice(lo,hi+1).forEach(i=>msel.add(i));
  }else{
    if(!msel.size&&selId&&selId!==id)msel.add(selId);
    if(msel.has(id))msel.delete(id);else msel.add(id);
    mAnchor=id;
  }
  mRefresh();
},true);

/* keyboard: Cmd+A, Cmd+C, Cmd+D, Delete, Esc */
document.addEventListener('keydown',e=>{
  if(view!=='editor'||$('#modalRoot').firstChild)return;
  if(e.key==='Escape'){if(msel.size){msel.clear();mRefresh();}return;}
  if(mode!=='edit'||RO()||mTyping())return;
  const mod=e.ctrlKey||e.metaKey,k=e.key.toLowerCase();
  if(mod&&!e.shiftKey&&!e.altKey&&k==='a'){
    if(cur.regions.length){
      e.preventDefault();
      cur.regions.forEach(r=>msel.add(r.id));mRefresh();
      toast(msel.size+' element'+(msel.size===1?'':'s')+' selected');
    }
    return;
  }
  if(mod&&!e.shiftKey&&k==='c'){
    if(msel.size>1){e.preventDefault();e.stopPropagation();e.stopImmediatePropagation();mCopy();}
    else{try{localStorage.removeItem(MKEY);}catch(x){}}
    return;
  }
  if(mod&&!e.shiftKey&&k==='d'){
    if(msel.size>1){e.preventDefault();e.stopPropagation();e.stopImmediatePropagation();mDup();}
    else{try{localStorage.removeItem(MKEY);}catch(x){}}
    return;
  }
  if(!mod&&(e.key==='Delete'||e.key==='Backspace')&&msel.size>1){
    e.preventDefault();e.stopPropagation();e.stopImmediatePropagation();mDel();
  }
},true);

/* TRE-ARROWFIX js: keep pointer capture alive while an arrow is repainted */
(function(){
  const redirect=el=>(el instanceof SVGElement&&el.closest&&el.closest('.region'))||el;
  ['setPointerCapture','releasePointerCapture','hasPointerCapture'].forEach(n=>{
    const o=Element.prototype[n];if(!o)return;
    Element.prototype[n]=function(id){return o.call(redirect(this),id);};
  });
})();

boot();
</script>
